<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Project XIX — The Clubhouse</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1C3A2A;--gold:#C9A84C;--cream:#F5F0E8}
html,body{height:100%;overflow:hidden;background:#0a0f0c}
body{font-family:'Inter',sans-serif;color:var(--cream)}
canvas{display:block}
/* ── Loading ── */
#loader{position:fixed;inset:0;background:var(--green);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .8s}
#loader.hide{opacity:0;pointer-events:none}
.loader-title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;letter-spacing:.24em}
.loader-title span{color:var(--gold)}
.loader-sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(245,240,232,.55)}
.loader-bar{width:180px;height:2px;background:rgba(245,240,232,.15);overflow:hidden;border-radius:1px}
.loader-fill{height:100%;width:30%;background:var(--gold);animation:load 1.4s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
/* ── Nav ── */
#nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 22px;background:linear-gradient(to bottom,rgba(8,14,10,.72),transparent);pointer-events:none}
#nav>*{pointer-events:auto}
.back-btn{display:flex;align-items:center;gap:8px;border:1px solid rgba(245,240,232,.3);border-radius:6px;background:rgba(10,16,12,.45);color:var(--cream);font-size:11px;letter-spacing:.1em;padding:8px 14px;cursor:pointer;backdrop-filter:blur(8px);transition:border-color .2s}
.back-btn:hover{border-color:var(--gold)}
.nav-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;letter-spacing:.08em}
.nav-title b{color:var(--gold);font-weight:500}
.nav-sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,240,232,.55)}
/* ── Time of day control ── */
#todWrap{position:fixed;top:16px;right:20px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tod-btns{display:flex;gap:6px}
.tod-btn{border:1px solid rgba(245,240,232,.28);background:rgba(10,16,12,.5);color:rgba(245,240,232,.8);border-radius:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;cursor:pointer;backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;transition:all .2s}
.tod-btn:hover{border-color:var(--gold);color:var(--cream)}
.tod-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(28,58,42,.6)}
.tod-btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#todSlider{-webkit-appearance:none;appearance:none;width:200px;height:3px;border-radius:2px;background:linear-gradient(90deg,#0c1a3a 0%,#e8a44c 25%,#bcd8f0 50%,#e8a44c 75%,#0c1a3a 100%);outline:none;cursor:pointer}
#todSlider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid #fff;cursor:pointer}
#todLabel{font-size:10px;letter-spacing:.14em;color:rgba(245,240,232,.6)}
/* ── Viewpoints ── */
#vps{position:fixed;left:20px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:7px}
.vp-btn{display:flex;align-items:center;gap:10px;border:1px solid rgba(245,240,232,.22);background:rgba(10,16,12,.5);color:rgba(245,240,232,.82);border-radius:8px;padding:9px 13px;font-size:11px;letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(8px);transition:all .2s;text-align:left;min-width:168px}
.vp-btn:hover{border-color:var(--gold)}
.vp-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(28,58,42,.62)}
.vp-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* ── Hint / HUD ── */
#hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;font-size:11px;letter-spacing:.12em;color:rgba(245,240,232,.75);background:rgba(10,16,12,.5);border:1px solid rgba(245,240,232,.18);border-radius:20px;padding:8px 18px;backdrop-filter:blur(8px);transition:opacity .6s;text-align:center}
#hint.hide{opacity:0}
/* ── Minimap ── */
#minimap{position:fixed;bottom:20px;right:20px;z-index:20;width:180px;background:rgba(10,16,12,.55);border:1px solid rgba(245,240,232,.2);border-radius:10px;padding:10px;backdrop-filter:blur(8px)}
#minimap .mm-title{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,240,232,.5);margin-bottom:6px}
#coords{font-size:9px;letter-spacing:.1em;color:rgba(245,240,232,.45);margin-top:5px;font-family:monospace}
/* ── Mobile joystick ── */
#joy{position:fixed;bottom:34px;left:30px;width:110px;height:110px;border-radius:50%;border:1.5px solid rgba(245,240,232,.3);background:rgba(10,16,12,.3);z-index:25;display:none;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(201,168,76,.85);transform:translate(-50%,-50%)}
@media (pointer:coarse){#joy{display:block}#vps{transform:none;top:auto;bottom:160px;flex-direction:row;flex-wrap:wrap;left:20px;right:20px}.vp-btn{min-width:0;padding:8px 10px}.vp-btn span{display:none}#minimap{display:none}#todSlider{width:140px}}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-title">PROJECT <span>XIX</span></div>
  <div class="loader-sub">The Clubhouse · Imperial Pavilion</div>

</div>

<div id="nav">
  <button class="back-btn" onclick="location.href='polo-field.html'">← Polo Field</button>
  <div>
    <div class="nav-title">THE <b>CLUBHOUSE</b></div>
    <div class="nav-sub">3,419 sqm · 3 Floors · 8 Skyboxes</div>
  </div>
</div>

<div id="todWrap">
  <div class="tod-btns">
    <button class="tod-btn" data-h="10.5" id="tb-day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.5 4.5l2 2M17.5 17.5l2 2M19.5 4.5l-2 2M6.5 17.5l-2 2"/></svg>Day</button>
    <button class="tod-btn" data-h="17.6" id="tb-sunset"><svg viewBox="0 0 24 24"><path d="M4 17h16M7 13a5 5 0 0 1 10 0M12 4v3M5 8l1.5 1.5M19 8l-1.5 1.5"/></svg>Sunset</button>
    <button class="tod-btn" data-h="21.5" id="tb-night"><svg viewBox="0 0 24 24"><path d="M20 13.5A8 8 0 1 1 10.5 4 6.5 6.5 0 0 0 20 13.5z"/></svg>Night</button>
  </div>
  <input type="range" id="todSlider" min="5" max="23" step="0.05" value="10.5">
  <div id="todLabel">10:30 · Lagos Morning</div>
</div>

<div id="vps"></div>

<div id="hint">Drag to look · Click a viewpoint · W A S D to walk freely</div>

<div id="minimap">
  <div class="mm-title">The Clubhouse</div>
  <svg id="mmSvg" viewBox="0 0 160 120" width="160" height="100">
    <rect x="10" y="52" width="140" height="26" fill="none" stroke="rgba(245,240,232,.45)" stroke-width="1"/>
    <rect x="55" y="44" width="50" height="34" fill="none" stroke="rgba(245,240,232,.45)" stroke-width="1"/>
    <rect x="45" y="30" width="70" height="14" fill="none" stroke="rgba(201,168,76,.5)" stroke-width="1"/>
    <text x="80" y="26" fill="rgba(245,240,232,.4)" font-size="7" text-anchor="middle" letter-spacing="2">POLO FIELD</text>
    <rect x="52" y="80" width="8" height="10" fill="none" stroke="rgba(245,240,232,.35)" stroke-width="1"/>
    <rect x="100" y="80" width="8" height="10" fill="none" stroke="rgba(245,240,232,.35)" stroke-width="1"/>
    <circle id="mmDot" cx="80" cy="20" r="3.2" fill="#C9A84C"/>
    <path id="mmCone" d="M80 20 L74 10 L86 10 Z" fill="rgba(201,168,76,.35)"/>
  </svg>
  <div id="coords">x 0.0 · z 0.0</div>
</div>

<div id="joy"><div id="joyKnob"></div></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';

/* ═══════════════════════════ RENDERER / SCENE ═══════════════════════════
   World: origin = centre of clubhouse at ground. Building faces -Z (field).
   +X east · 1 unit = 1 m · eye height 1.65 m
════════════════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe0c8, 140, 520);
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 2200);

/* ═══════════════════════════ SKY / SUN / DAY-NIGHT ══════════════════════ */
const sky = new Sky();
sky.scale.setScalar(2000);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU.turbidity.value = 6; skyU.rayleigh.value = 1.6;
skyU.mieCoefficient.value = 0.004; skyU.mieDirectionalG.value = 0.85;

const sun = new THREE.DirectionalLight(0xffffff, 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -140; sun.shadow.camera.right = 140;
sun.shadow.camera.top = 140; sun.shadow.camera.bottom = -140;
sun.shadow.camera.far = 600;
sun.shadow.bias = -0.0004;
scene.add(sun); scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xbcd8f0, 0x4a5a3a, 0.55);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8ab0e0, 0);
moon.position.set(-120, 160, -80);
scene.add(moon);

// Stars
const starGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array(1200*3);
  for (let i=0;i<1200;i++){
    const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1)*0.5;
    const r = 900;
    pos[i*3]=r*Math.sin(p)*Math.cos(t); pos[i*3+1]=r*Math.cos(p)+60; pos[i*3+2]=r*Math.sin(p)*Math.sin(t);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
}
const starMat = new THREE.PointsMaterial({ color:0xdfe8ff, size:1.6, transparent:true, opacity:0, sizeAttenuation:true, depthWrite:false });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// PMREM environment from sky (throttled regen)
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function refreshEnv(){
  const tmp = pmrem.fromScene(sky, 0, 0.1, 1000);
  if (envRT) envRT.dispose();
  envRT = tmp;
  scene.environment = envRT.texture;
}

/* ═══════════════════════════ CANVAS TEXTURE FACTORY ═════════════════════ */
function tex(w, h, draw, rx=1, ry=1){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const rand = (a,b)=>a+Math.random()*(b-a);

// ── Plaster (cream, subtle streaks + noise) ──
const plasterTex = tex(512,512,(g,w,h)=>{
  g.fillStyle='#eae3d4'; g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){ g.fillStyle=`rgba(${rand(180,215)|0},${rand(172,205)|0},${rand(150,185)|0},${rand(.03,.1)})`; g.fillRect(rand(0,w),rand(0,h),rand(1,3),rand(1,3)); }
  for(let i=0;i<26;i++){ g.strokeStyle=`rgba(150,140,118,${rand(.02,.06)})`; g.lineWidth=rand(1,4); g.beginPath(); const x=rand(0,w); g.moveTo(x,0); g.bezierCurveTo(x+rand(-24,24),h*.33,x+rand(-24,24),h*.66,x+rand(-30,30),h); g.stroke(); }
},2,2);
const plasterRough = tex(256,256,(g,w,h)=>{ g.fillStyle='#b8b8b8'; g.fillRect(0,0,w,h); for(let i=0;i<4000;i++){ const v=rand(140,215)|0; g.fillStyle=`rgba(${v},${v},${v},.5)`; g.fillRect(rand(0,w),rand(0,h),2,2);} },2,2);
plasterRough.colorSpace = THREE.NoColorSpace;

// ── Polo grass (mowing stripes + blade noise) ──
const grassTex = tex(1024,1024,(g,w,h)=>{
  for(let s=0;s<8;s++){ g.fillStyle = s%2? '#3f6b28':'#487a2e'; g.fillRect(s*w/8,0,w/8,h); }
  for(let i=0;i<26000;i++){ g.strokeStyle=`rgba(${rand(40,95)|0},${rand(95,150)|0},${rand(30,60)|0},${rand(.15,.4)})`; g.lineWidth=1; const x=rand(0,w),y=rand(0,h); g.beginPath(); g.moveTo(x,y); g.lineTo(x+rand(-2,2),y-rand(2,6)); g.stroke(); }
},30,30);
const lawnTex = grassTex.clone(); lawnTex.repeat.set(8,8); lawnTex.needsUpdate = true;

// ── Paving stone ──
const paveTex = tex(512,512,(g,w,h)=>{
  g.fillStyle='#c8c0ae'; g.fillRect(0,0,w,h);
  const tile=128;
  for(let y=0;y<h;y+=tile) for(let x=0;x<w;x+=tile){
    g.fillStyle=`rgb(${rand(185,205)|0},${rand(178,196)|0},${rand(158,178)|0})`;
    g.fillRect(x+2,y+2,tile-4,tile-4);
    for(let i=0;i<70;i++){ g.fillStyle=`rgba(120,112,95,${rand(.05,.16)})`; g.fillRect(x+rand(3,tile-5),y+rand(3,tile-5),2,2); }
  }
},10,10);

// ── Timber (warm iroko for terrace balustrade / soffits) ──
const timberTex = tex(512,256,(g,w,h)=>{
  g.fillStyle='#8a5c28'; g.fillRect(0,0,w,h);
  for(let i=0;i<90;i++){ g.strokeStyle=`rgba(${rand(90,150)|0},${rand(55,95)|0},${rand(18,42)|0},${rand(.25,.6)})`; g.lineWidth=rand(1,3); g.beginPath(); const y=rand(0,h); g.moveTo(0,y); g.bezierCurveTo(w*.3,y+rand(-7,7),w*.7,y+rand(-7,7),w,y+rand(-5,5)); g.stroke(); }
  for(let i=0;i<10;i++){ const x=rand(0,w),y=rand(0,h); g.strokeStyle='rgba(70,42,15,.5)'; g.beginPath(); g.ellipse(x,y,rand(3,7),rand(2,4),0,0,7); g.stroke(); }
},3,1);

// ── Dark soffit timber ──
const soffitTex = tex(512,256,(g,w,h)=>{
  g.fillStyle='#6a4318'; g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=14){ g.fillStyle=`rgba(40,24,8,${rand(.3,.55)})`; g.fillRect(x,0,2,h); }
  for(let i=0;i<60;i++){ g.strokeStyle=`rgba(${rand(110,150)|0},${rand(70,95)|0},${rand(25,45)|0},.3)`; g.beginPath(); const y=rand(0,h); g.moveTo(0,y); g.lineTo(w,y+rand(-4,4)); g.stroke(); }
},6,1);

// ── Hedge ──
const hedgeTex = tex(256,256,(g,w,h)=>{
  g.fillStyle='#2a4718'; g.fillRect(0,0,w,h);
  for(let i=0;i<3200;i++){ g.fillStyle=`rgba(${rand(35,90)|0},${rand(80,135)|0},${rand(20,50)|0},${rand(.3,.8)})`; g.beginPath(); g.arc(rand(0,w),rand(0,h),rand(1.5,4),0,7); g.fill(); }
},3,1);

// ── Bougainvillea ──
const bougTex = tex(256,256,(g,w,h)=>{
  g.fillStyle='#2c4a1a'; g.fillRect(0,0,w,h);
  for(let i=0;i<2000;i++){ g.fillStyle=`rgba(${rand(35,80)|0},${rand(85,130)|0},${rand(25,50)|0},.7)`; g.beginPath(); g.arc(rand(0,w),rand(0,h),rand(2,4),0,7); g.fill(); }
  for(let i=0;i<900;i++){ g.fillStyle=`rgba(${rand(190,235)|0},${rand(30,70)|0},${rand(90,140)|0},${rand(.5,.9)})`; g.beginPath(); g.arc(rand(0,w),rand(0,h),rand(1.5,3.5),0,7); g.fill(); }
},2,1);

// ── Palm trunk rings ──
const palmTrunkTex = tex(128,512,(g,w,h)=>{
  g.fillStyle='#8a7454'; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=16){ g.fillStyle=`rgba(${rand(70,100)|0},${rand(55,80)|0},${rand(35,55)|0},.8)`; g.fillRect(0,y,w,rand(5,9)); g.fillStyle='rgba(30,22,12,.35)'; g.fillRect(0,y+9,w,2); }
  for(let i=0;i<600;i++){ g.fillStyle=`rgba(40,30,18,${rand(.1,.3)})`; g.fillRect(rand(0,w),rand(0,h),2,3); }
},1,3);

// ── Palm frond (alpha) ──
function frondCanvas(){
  const c=document.createElement('canvas'); c.width=512; c.height=128;
  const g=c.getContext('2d');
  g.clearRect(0,0,512,128);
  g.strokeStyle='#5a5030'; g.lineWidth=5; g.beginPath(); g.moveTo(0,64); g.quadraticCurveTo(300,58,512,72); g.stroke();
  for(let i=0;i<70;i++){
    const t=i/70, x=20+t*480, cy=64+(t*t*8);
    const len=(1-Math.abs(t-0.45))*54+8;
    const hue=rand(0,1)<.15? `rgb(${rand(120,160)|0},${rand(130,150)|0},60)` : `rgb(${rand(40,80)|0},${rand(105,150)|0},${rand(35,60)|0})`;
    g.strokeStyle=hue; g.lineWidth=rand(2.4,4);
    g.beginPath(); g.moveTo(x,cy); g.quadraticCurveTo(x+14,cy-len*.6,x+rand(4,20),cy-len); g.stroke();
    g.beginPath(); g.moveTo(x,cy); g.quadraticCurveTo(x+14,cy+len*.6,x+rand(4,20),cy+len); g.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
const frondTex = frondCanvas();

// ── Split-face stone wall (entrance accent, per reference render) ──
const stoneTex = tex(512,512,(g,w,h)=>{
  g.fillStyle='#c2ac86'; g.fillRect(0,0,w,h);
  const rowH=38;
  for (let y=0,row=0; y<h; y+=rowH, row++){
    let x = -rand(0,40) + (row%2)*20;
    while (x<w){
      const bw = rand(50,110);
      const v = rand(-22,20);
      g.fillStyle = `rgb(${168+v|0},${150+v|0},${118+v*0.8|0})`;
      g.fillRect(x, y, bw-3, rowH-3);
      // texture speckle per stone
      for (let i=0;i<25;i++){ g.fillStyle=`rgba(${rand(90,140)|0},${rand(75,120)|0},${rand(50,90)|0},${rand(.08,.22)})`; g.fillRect(x+rand(0,bw-3),y+rand(0,rowH-3),rand(2,6),rand(2,4)); }
      g.fillStyle='rgba(60,48,32,.4)'; g.fillRect(x,y,bw-3,1.5);
      x += bw;
    }
    g.fillStyle='rgba(40,32,22,.5)'; g.fillRect(0,y,w,2);
  }
},2.4,2.4);
const stoneRough = tex(256,256,(g,w,h)=>{ g.fillStyle='#a8a8a8'; g.fillRect(0,0,w,h); for(let i=0;i<3000;i++){ const v=rand(150,230)|0; g.fillStyle=`rgba(${v},${v},${v},.5)`; g.fillRect(rand(0,w),rand(0,h),2,2);} },2.4,2.4);

// ── Timber slat ceiling (linear slats, warm dark iroko, per reference render) ──
const slatCeilTex = tex(256,256,(g,w,h)=>{
  g.fillStyle='#3a2412'; g.fillRect(0,0,w,h);
  const sW = 10;
  for (let x=0;x<w;x+=sW){
    const v = rand(-14,16);
    g.fillStyle = `rgb(${74+v|0},${48+v*.8|0},${26+v*.5|0})`;
    g.fillRect(x, 0, sW-1.6, h);
    for (let i=0;i<14;i++){ g.strokeStyle=`rgba(30,18,8,${rand(.15,.35)})`; g.lineWidth=.6; g.beginPath(); g.moveTo(x+rand(1,sW-2),0); g.lineTo(x+rand(1,sW-2),h); g.stroke(); }
  }
},1,6);


/* ═══════════════════════════ MATERIALS ═════════════════════════════════ */
const M = {
  plaster: new THREE.MeshStandardMaterial({ map:plasterTex, roughnessMap:plasterRough, roughness:.92, color:0xf2ead9 }),
  plasterWhite: new THREE.MeshStandardMaterial({ map:plasterTex, roughness:.85, color:0xfaf6ec }),

/* ═══════════════════════════ HELPERS ═══════════════════════════════════ */
function box(w,h,d,mat,x,y,z,parent=world,shadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m); return m;
}
const litGlassPanes = [];
function windowUnit(w,h,x,y,z,parent,ry=0){
  const g = new THREE.Group(); g.position.set(x,y,z); g.rotation.y = ry; parent.add(g);
  const lit = Math.random() < .55;
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(w-.16,h-.16), lit? M.glassLit.clone() : M.glass);
  pane.position.z = .02; g.add(pane);
  if (lit) litGlassPanes.push(pane);
  const fr = new THREE.Mesh(new THREE.BoxGeometry(w,.08,.06), M.darkFrame); fr.position.y=h/2; g.add(fr);
  const fb = fr.clone(); fb.position.y=-h/2; g.add(fb);
  const fl = new THREE.Mesh(new THREE.BoxGeometry(.08,h,.06), M.darkFrame); fl.position.x=-w/2; g.add(fl);
  const fr2 = fl.clone(); fr2.position.x=w/2; g.add(fr2);
  const mull = new THREE.Mesh(new THREE.BoxGeometry(.05,h-.1,.05), M.darkFrame); g.add(mull);
  return g;
}

function palm(x, z, s=1){
  const g = new THREE.Group(); g.position.set(x,0,z);
  const h = rand(7,11)*s;
  // curved trunk
  const lean = rand(-.14,.14), leanZ = rand(-.1,.1);
  const pts = [];
  for (let i=0;i<=8;i++){ const t=i/8; pts.push(new THREE.Vector3(Math.sin(lean)*t*t*h*.5, t*h, Math.sin(leanZ)*t*t*h*.4)); }
  const trunk = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 12, .22*s, 7), M.trunk);
  trunk.castShadow = true; g.add(trunk);
  const top = pts[8];
  const crown = new THREE.Group(); crown.position.copy(top); g.add(crown);
  const n = 11;
  for (let i=0;i<n;i++){
    const f = new THREE.Mesh(new THREE.PlaneGeometry(4.2*s, 1.05*s, 8, 1), M.frond);
    // droop the frond by bending vertices
    const p = f.geometry.attributes.position;
    for (let v=0;v<p.count;v++){ const px=p.getX(v); const t=(px+2.1*s)/(4.2*s); p.setY(v, p.getY(v) - t*t*1.6*s); }
    p.needsUpdate = true; f.geometry.computeVertexNormals();
    f.position.x = 0;
    const hold = new THREE.Group();
    hold.rotation.y = (i/n)*Math.PI*2 + rand(-.15,.15);
    hold.rotation.z = rand(-.32,-.05);
    f.position.x = 2.0*s;
    hold.add(f); crown.add(hold);
    f.castShadow = true;
  }
  // coconuts
  for (let i=0;i<4;i++){
    const c = new THREE.Mesh(new THREE.SphereGeometry(.16*s, 8, 6), M.trunk);
    c.position.set(rand(-.3,.3), -.15, rand(-.3,.3)); crown.add(c);
  }
  world.add(g);
  palms.push({ crown, phase: rand(0, 6.28) });
  return g;
}

for (const x of [-12, 0, 12]){
  const l = new THREE.PointLight(0xffd090, 0, 14, 2);
  l.position.set(x, F+2.4, TER_Z); scene.add(l); nightLights.push(l);
}
// Facade wash
const facadeWash = new THREE.SpotLight(0xffe0b0, 0, 90, .9, .6, 1.4);
facadeWash.position.set(0, 2, -46); facadeWash.target.position.set(0, 8, 0);
scene.add(facadeWash); scene.add(facadeWash.target); nightLights.push(facadeWash);

/* ═══════════════════════════ TIME OF DAY ENGINE ════════════════════════ */
let hour = 10.5, envDirty = true;
function setHour(h){
  hour = h; envDirty = true;
  const el = THREE.MathUtils.clamp(Math.sin((h-6)/12*Math.PI), -0.35, 1);   // sun elevation factor
  const elevation = el * 62;                                                // degrees
  const azimuth = 115 + ((h-6)/12)*130;                                     // sweep W→E
  const phi = THREE.MathUtils.degToRad(90 - elevation);
  const theta = THREE.MathUtils.degToRad(azimuth);
  const sp = new THREE.Vector3().setFromSphericalCoords(1, phi, theta);
  skyU.sunPosition.value.copy(sp);
  sun.position.copy(sp).multiplyScalar(300);
  sun.target.position.set(0, 4, 0);

  const day = THREE.MathUtils.smoothstep(el, 0.02, 0.28);                   // 0 night → 1 day
  const dusk = Math.max(0, 1 - Math.abs(el - .1)/.18);                      // sunset band
  skyU.turbidity.value = 6 + dusk*6;
  skyU.rayleigh.value = 1.4 + dusk*1.8;
  skyU.mieCoefficient.value = .004 + dusk*.02;

  sun.intensity = 3.4 * day;
  sun.color.setHSL(.09 + .02*day, .55 - .35*day + dusk*.3, .55 + .1*day);
  hemi.intensity = .12 + .5*day;
  moon.intensity = (1-day) * .28;
  starMat.opacity = (1-day) * .9;
  renderer.toneMappingExposure = .28 + .3*day + dusk*.12;
  const _fogDay = 0xcfe0c8, _fogDusk = 0xe0a868, _fogNight = 0x0a1220;
  scene.fog.color.set(_fogNight).lerp(new THREE.Color(_fogDay), day).lerp(new THREE.Color(_fogDusk), dusk*.6);

  const glow = (1-day);
  for (const p of litGlassPanes) p.material.emissiveIntensity = glow * rand(1.4, 2.4);
  for (const nl of nightLights){
    if (nl.isLight) nl.intensity = glow * (nl.isSpotLight? 60 : 6);
    else nl.material.emissiveIntensity = glow*2.2;
  }
  const hh = Math.floor(h), mm = Math.round((h-hh)*60).toString().padStart(2,'0');
  const label = day>.7? 'Lagos '+(h<12?'Morning':'Afternoon') : day>.15? 'Golden Hour' : 'Lagos Night';
  document.getElementById('todLabel').textContent = `${hh}:${mm} · ${label}`;
  document.querySelectorAll('.tod-btn').forEach(b=>b.classList.toggle('active', Math.abs(+b.dataset.h - h) < .8));
}
document.getElementById('todSlider').addEventListener('input', e=> setHour(+e.target.value));
document.querySelectorAll('.tod-btn').forEach(b=> b.addEventListener('click', ()=>{
  const target = +b.dataset.h; const start = hour; const t0 = performance.now();
  document.getElementById('todSlider').value = target;
  (function anim(){ const t = Math.min(1,(performance.now()-t0)/900); setHour(start + (target-start)*(t*t*(3-2*t))); if (t<1) requestAnimationFrame(anim); })();
}));

/* ═══════════════════════════ CAMERA / VIEWPOINTS ═══════════════════════ */
const EYE = 1.65;
const VPS = [
  { name:'Field Approach', icon:'M3 20l7-14 4 7 3-4 4 11z', pos:[0, EYE+0.4, -66], yaw:Math.PI, pitch:.04 },
  { name:'Entrance Lounge', icon:'M4 20V10l8-6 8 6v10M4 20h16M8 20v-6h8v6', pos:[-34, EYE, -B.D/2-8], yaw:0, pitch:0 },
  { name:'Bleachers',      icon:'M4 18h4v-3h4v-3h4V9h4', pos:[8, 2.6, -B.D/2-CBD-5], yaw:Math.PI, pitch:.12 },
  { name:'Grand Terrace',  icon:'M12 3v4M5 11a7 7 0 0 1 14 0M12 7v13M8 20h8', pos:[0, F+EYE, TER_Z+1], yaw:0, pitch:-.05 },
  { name:'Skybox Lounge',  icon:'M3 9h18v9H3zM3 9l3-4h12l3 4M9 13h6', pos:[-6, F+EYE, -B.D/2-CBD+3.4], yaw:0, pitch:0 },
  { name:'Grand Lounge',   icon:'M4 18v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6M4 14h16', pos:[0, EYE, 2.5], yaw:0, pitch:0 },
  { name:'Rooftop Pavilion', icon:'M12 3l8 6v2H4V9zM6 11v8M18 11v8M12 11v8', pos:[13.5, 3*F+1.7+EYE, B.D/2-6], yaw:Math.PI, pitch:-.14 },
];
let yaw = Math.PI, pitch = .04, freeWalk = false, activeVP = 0;
camera.position.set(...VPS[0].pos);

const vpsEl = document.getElementById('vps');
VPS.forEach((v,i)=>{
  const b = document.createElement('button');
  b.className = 'vp-btn' + (i===0?' active':'');
  b.innerHTML = `<svg viewBox="0 0 24 24"><path d="${v.icon}"/></svg><span>${v.name}</span>`;
  b.onclick = ()=> goVP(i);
  vpsEl.appendChild(b);
});
let lerpFrom=null, lerpTo=null, lerpT=1, yawFrom=0, yawTo=0, pitchFrom=0, pitchTo=0;
function goVP(i){
  activeVP = i; freeWalk = false; vel.set(0,0,0);
  document.querySelectorAll('.vp-btn').forEach((b,k)=>b.classList.toggle('active',k===i));
  lerpFrom = camera.position.clone(); lerpTo = new THREE.Vector3(...VPS[i].pos);
  yawFrom = yaw; pitchFrom = pitch;
  yawTo = VPS[i].yaw; pitchTo = VPS[i].pitch;
  // shortest yaw path
  while (yawTo - yawFrom > Math.PI) yawTo -= Math.PI*2;
  while (yawTo - yawFrom < -Math.PI) yawTo += Math.PI*2;
  lerpT = 0;
}

/* ═══════════════════════════ CONTROLS ══════════════════════════════════ */
const keys = {}, vel = new THREE.Vector3();
const WALK = 8, SPRINT = 20, DAMP = 0.86;
addEventListener('keydown', e=>{
  keys[e.code]=true;
  if (['KeyW','KeyA','KeyS','KeyD'].includes(e.code) && !freeWalk){ freeWalk=true; lerpT=1; document.querySelectorAll('.vp-btn').forEach(b=>b.classList.remove('active')); }
});
addEventListener('keyup', e=> keys[e.code]=false);

let dragging=false, px=0, py=0;
renderer.domElement.addEventListener('pointerdown', e=>{
  if (freeWalk && !document.pointerLockElement && e.pointerType==='mouse'){ renderer.domElement.requestPointerLock(); return; }
  dragging=true; px=e.clientX; py=e.clientY;
  document.getElementById('hint').classList.add('hide');
});
addEventListener('pointerup', ()=> dragging=false);
addEventListener('pointermove', e=>{
  if (document.pointerLockElement){ yaw -= e.movementX*.0022; pitch -= e.movementY*.0022; }
  else if (dragging){ yaw -= (e.clientX-px)*.0035; pitch -= (e.clientY-py)*.0035; px=e.clientX; py=e.clientY; }
  pitch = THREE.MathUtils.clamp(pitch, -1.25, 1.25);
});
addEventListener('keydown', e=>{ if (e.code==='Escape' && document.pointerLockElement) document.exitPointerLock(); });

// Mobile joystick
const joy = document.getElementById('joy'), knob = document.getElementById('joyKnob');
let joyVec = {x:0, y:0}, joyId = null;
joy.addEventListener('touchstart', e=>{ joyId = e.changedTouches[0].identifier; freeWalk = true; lerpT=1; }, {passive:true});
joy.addEventListener('touchmove', e=>{
  for (const t of e.changedTouches) if (t.identifier===joyId){
    const r = joy.getBoundingClientRect();
    let dx = t.clientX-(r.left+55), dy = t.clientY-(r.top+55);
    const m = Math.hypot(dx,dy); if (m>40){ dx*=40/m; dy*=40/m; }
    joyVec = {x:dx/40, y:dy/40};
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
}, {passive:true});
joy.addEventListener('touchend', ()=>{ joyVec={x:0,y:0}; knob.style.transform='translate(-50%,-50%)'; }, {passive:true});

/* ═══════════════════════════ BOUNDS / COLLISION ════════════════════════ */
function clampPos(p){
  p.x = THREE.MathUtils.clamp(p.x, -110, 110);
  p.z = THREE.MathUtils.clamp(p.z, -110, 60);
  // keep out of solid wing masses when at ground level (crude)
  if (p.y < F && Math.abs(p.x) > 14 && Math.abs(p.x) < 43 && p.z > -B.D/2+.6 && p.z < B.D/2){
    p.z = -B.D/2+.6 - .01 > p.z ? p.z : -B.D/2 + .59;
  }
  return p;
}

/* ═══════════════════════════ MAIN LOOP ═════════════════════════════════ */
const mmDot = document.getElementById('mmDot'), mmCone = document.getElementById('mmCone'), coordsEl = document.getElementById('coords');
const clock = new THREE.Clock();

/* ── Seamless portal back to the polo field ── */
let portalFired = false;
const portalFade = document.createElement('div');
portalFade.style.cssText = 'position:fixed;inset:0;background:#0a0f0c;opacity:0;pointer-events:none;z-index:90;transition:opacity .35s';
document.body.appendChild(portalFade);
function firePortal(url){ portalFired = true; portalFade.style.opacity = '1'; setTimeout(()=> window.location.href = url, 380); }
(function fadeInIfArriving(){
  if (new URLSearchParams(window.location.search).get('entry') === 'field'){
    portalFade.style.opacity = '1';
    requestAnimationFrame(()=> setTimeout(()=> portalFade.style.opacity = '0', 60));
  }
})();
let envTimer = 0;
setHour(10.5);
refreshEnv();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  // Walk far enough back toward the field and the estate "continues" — portal to polo-field.html
  if (freeWalk && !portalFired && camera.position.z < -64){
    firePortal('polo-field.html?entry=clubhouse');
  }

  // VP lerp
  if (lerpT < 1){
    lerpT = Math.min(1, lerpT + dt*.85);
    const s = lerpT*lerpT*(3-2*lerpT);
    camera.position.lerpVectors(lerpFrom, lerpTo, s);
    yaw = yawFrom + (yawTo-yawFrom)*s;
    pitch = pitchFrom + (pitchTo-pitchFrom)*s;
  }

  // Free walk
  if (freeWalk){
    const sp = keys['ShiftLeft']||keys['ShiftRight'] ? SPRINT : WALK;
    const f = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const r = new THREE.Vector3(-f.z,0,f.x);
    const acc = new THREE.Vector3();
    if (keys['KeyW']) acc.add(f); if (keys['KeyS']) acc.sub(f);
    if (keys['KeyD']) acc.add(r); if (keys['KeyA']) acc.sub(r);
    acc.add(f.clone().multiplyScalar(-joyVec.y)).add(r.clone().multiplyScalar(joyVec.x));
    if (acc.lengthSq()>0) acc.normalize().multiplyScalar(sp*dt*4);
    vel.add(acc).multiplyScalar(DAMP);
    camera.position.add(vel.clone().multiplyScalar(dt*10));
    camera.position.y = camera.position.y > F ? camera.position.y : EYE;   // keep upper levels if already there
    if (camera.position.y <= F) camera.position.y = EYE;
    clampPos(camera.position);
  }

  camera.rotation.set(0,0,0);
  camera.rotateY(yaw); camera.rotateX(pitch);

  // Palm sway
  for (const p of palms){
    p.crown.rotation.z = Math.sin(t*.7 + p.phase)*.03;
    p.crown.rotation.x = Math.cos(t*.55 + p.phase)*.025;
  }

  // Env regen (throttled while slider moves)
  envTimer += dt;
  if (envDirty && envTimer > .25){ refreshEnv(); envDirty = false; envTimer = 0; }

  // Minimap: world x[-110,110]→svg x[10,150], z[-110,60]→ y[10,110] (field at top)
  const mx = 10 + (camera.position.x+110)/220*140;
  const my = 10 + (camera.position.z+110)/170*100;
  mmDot.setAttribute('cx', mx); mmDot.setAttribute('cy', my);
  const a = yaw + Math.PI; // svg up = -z
  const c1x = mx + Math.sin(a-.45)*12, c1y = my + Math.cos(a-.45)*12;
  const c2x = mx + Math.sin(a+.45)*12, c2y = my + Math.cos(a+.45)*12;
  mmCone.setAttribute('d', `M${mx} ${my} L${c1x} ${c1y} L${c2x} ${c2y} Z`);
  coordsEl.textContent = `x ${camera.position.x.toFixed(1)} · z ${camera.position.z.toFixed(1)}`;

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
setTimeout(()=> document.getElementById('loader').classList.add('hide'), 1400);
setTimeout(()=> document.getElementById('hint').classList.add('hide'), 9000);
</script>
