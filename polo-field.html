<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Project XIX — Polo Field</title>
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1C3A2A;--gold:#C9A84C;--cream:#F5F0E8}
body{background:#0a1505;overflow:hidden;font-family:'Inter',sans-serif}

#loader{position:fixed;inset:0;z-index:200;background:#0a1505;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s ease}
#loader.fade{opacity:0;pointer-events:none}
.l-title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;
  color:var(--cream);letter-spacing:.08em;margin-bottom:5px}
.l-title span{color:var(--gold)}
.l-sub{font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(245,240,232,.3);margin-bottom:50px}
.l-bar{width:160px;height:1px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.l-bar::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:var(--gold);animation:lb 2s ease forwards}
@keyframes lb{to{left:0}}

#top-nav{position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;padding:0 20px;height:54px;
  background:rgba(8,20,10,.88);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(201,168,76,.13);
  opacity:0;transition:opacity .5s ease .4s}
#top-nav.show{opacity:1}
.back{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:400;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(245,240,232,.55);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:5px;padding:6px 12px;cursor:pointer;text-decoration:none;transition:all .2s}
.back:hover{color:var(--cream);background:rgba(255,255,255,.11)}
.back svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round}
.nav-c{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:300;
  color:var(--cream);letter-spacing:.05em;position:absolute;left:50%;transform:translateX(-50%)}
.nav-r{font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);border:1px solid rgba(201,168,76,.3);border-radius:3px;padding:3px 8px;margin-left:auto}

#hint{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:8px;
  background:rgba(8,20,10,.85);backdrop-filter:blur(10px);
  border:1px solid rgba(201,168,76,.18);border-radius:40px;padding:8px 18px;
  font-size:11px;color:rgba(245,240,232,.5);white-space:nowrap;pointer-events:none;
  transition:opacity .5s ease}
#hint.gone{opacity:0}
#hint svg{stroke:var(--gold);fill:none;width:14px;height:14px;stroke-width:1.5;stroke-linecap:round}

/* Zone info card */
#zi{position:fixed;top:66px;right:16px;z-index:100;
  background:rgba(8,20,10,.92);backdrop-filter:blur(14px);
  border:1px solid rgba(201,168,76,.22);border-radius:10px;
  padding:14px 16px;max-width:210px;
  opacity:0;transition:opacity .35s ease;pointer-events:none}
#zi.show{opacity:1}
.zi-lbl{font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(201,168,76,.65);margin-bottom:4px}
.zi-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:400;
  color:var(--cream);margin-bottom:5px;line-height:1.2}
.zi-desc{font-size:11px;color:rgba(245,240,232,.4);line-height:1.55}

/* Viewpoint strip */
#vp{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(8,20,10,.92);backdrop-filter:blur(16px);
  border-top:1px solid rgba(201,168,76,.14);
  padding:11px 18px 18px;
  opacity:0;transition:opacity .5s ease .6s}
#vp.show{opacity:1}
.vp-lbl{font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,240,232,.25);margin-bottom:9px}
.vp-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.vp-row::-webkit-scrollbar{display:none}
.vp-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 13px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
  border-radius:7px;cursor:pointer;transition:all .2s;min-width:78px}
.vp-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(201,168,76,.35)}
.vp-btn.on{background:rgba(201,168,76,.1);border-color:#C9A84C}
.vp-ic{font-size:17px;line-height:1}
.vp-nm{font-size:9px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;
  text-align:center;line-height:1.3;color:rgba(245,240,232,.45)}
.vp-btn.on .vp-nm{color:#C9A84C}

a-scene canvas{display:block}
</style>
</head>
<body>

<div id="loader">
  <div class="l-title">PROJECT <span>XIX</span></div>
  <div class="l-sub">Polo Field · Ground Level</div>
  <div class="l-bar"></div>
</div>

<nav id="top-nav">
  <a class="back" href="index.html">
    <svg viewBox="0 0 16 16"><path d="M10 12L6 8l4-4"/></svg>
    Masterplan
  </a>
  <div class="nav-c">Polo Field</div>
  <div class="nav-r">3D LIVE</div>
</nav>

<div id="hint">
  <svg viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3M19 9l3 3-3 3M9 5l3-3 3 3M9 19l3 3 3-3"/></svg>
  Drag to look around · Click buildings to explore
</div>

<div id="zi">
  <div class="zi-lbl" id="zl">Zone</div>
  <div class="zi-name" id="zn"></div>
  <div class="zi-desc" id="zd"></div>
</div>

<div id="vp">
  <div class="vp-lbl">Standing points</div>
  <div class="vp-row">
    <button class="vp-btn on" onclick="go('centre')"   id="vb-centre">  <div class="vp-ic">⚽</div><div class="vp-nm">Centre<br>Field</div></button>
    <button class="vp-btn"    onclick="go('clubhouse')" id="vb-clubhouse"><div class="vp-ic">🏛</div><div class="vp-nm">Club<br>House</div></button>
    <button class="vp-btn"    onclick="go('lake')"     id="vb-lake">     <div class="vp-ic">🌊</div><div class="vp-nm">Lake<br>End</div></button>
    <button class="vp-btn"    onclick="go('villa-w')"  id="vb-villa-w">  <div class="vp-ic">🏠</div><div class="vp-nm">Villa<br>West</div></button>
    <button class="vp-btn"    onclick="go('villa-e')"  id="vb-villa-e">  <div class="vp-ic">🏠</div><div class="vp-nm">Villa<br>East</div></button>
    <button class="vp-btn"    onclick="go('stables')"  id="vb-stables">  <div class="vp-ic">🐎</div><div class="vp-nm">Stables<br>Yard</div></button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════
     A-FRAME SCENE
     Scale: 1 unit = 1 metre
     Origin (0,0,0) = centre of polo field
     +Z = south (toward clubhouse / Lagos road)
     -Z = north (toward lake / crescent villas)
     +X = east   -X = west
═════════════════════════════════════════════════ -->
<a-scene id="sc"
  fog="type:linear;color:#c8dfc0;near:200;far:450"
  renderer="antialias:true;colorManagement:true;physicallyCorrectLights:true;shadowMapEnabled:true"
  shadow="type:pcfsoft"
  vr-mode-ui="enabled:false"
  loading-screen="enabled:false"
  background="color:#82c4f0">

  <a-assets timeout="10000"></a-assets>

  <!-- ── Camera rig ── -->
  <a-entity id="rig" position="0 1.65 0">
    <a-camera id="cam"
      look-controls="pointerLockEnabled:false;magicWindowTrackingEnabled:true;touchEnabled:true"
      wasd-controls="enabled:false"
      fov="72" near="0.1" far="500">
    </a-camera>
  </a-entity>

  <!-- ══════════════════════════════════════
       LIGHTING — Lagos golden afternoon
  ══════════════════════════════════════ -->
  <a-light type="ambient"     color="#fce8b0" intensity="0.7"></a-light>
  <!-- Key sun — low angle from south-west, warm -->
  <a-light type="directional" color="#ffe0a0" intensity="1.6"
    position="-0.6 1 0.8" cast-shadow="true"
    shadow-camera-left="-250" shadow-camera-right="250"
    shadow-camera-top="250" shadow-camera-bottom="-250"
    shadow-camera-near="1" shadow-camera-far="600"
    shadow-map-width="2048" shadow-map-height="2048">
  </a-light>
  <!-- Sky fill — blue bounce from above -->
  <a-light type="directional" color="#c0d8ff" intensity="0.35" position="0 1 0"></a-light>
  <!-- Warm ground bounce -->
  <a-light type="hemisphere"  color="#ffe8a0" ground-color="#8b5a2b" intensity="0.3"></a-light>

  <!-- ══════════════════════════════════════
       SKY — Equatorial Lagos blue
       Warm amber band at horizon (harmattan)
  ══════════════════════════════════════ -->
  <a-sky color="#82c4f0" radius="490"></a-sky>
  <!-- Horizon warm haze ring -->
  <a-torus position="0 -14 0" radius="470" radius-tubular="55"
    segments-radial="28" segments-tubular="6"
    material="color:#d4aa60;opacity:0.16;transparent:true;side:back;shader:flat">
  </a-torus>

  <!-- ══════════════════════════════════════
       GROUND PLANES
  ══════════════════════════════════════ -->
  <!-- Red laterite base earth — entire site -->
  <a-plane position="0 0 0" rotation="-90 0 0" width="700" height="700"
    material="color:#7a4228;roughness:0.96;metalness:0;receive-shadow:true"></a-plane>

  <!-- Paved surrounds — dark grey roads/paths -->
  <!-- South road (Lagos road) -->
  <a-plane position="0 0.01 215" rotation="-90 0 0" width="500" height="18"
    material="color:#3a3a3a;roughness:0.85"></a-plane>

  <!-- ── POLO FIELD GREEN — 275m × 145m ── -->
  <a-plane id="polo-field" position="0 0.02 0" rotation="-90 0 0"
    width="145" height="275"
    material="color:#2e7a2e;roughness:0.92;metalness:0;receive-shadow:true"
    class="clickable"
    data-lbl="Main Field" data-name="International Polo Field"
    data-desc="FIP-standard · 275m × 145m · Red laterite pony track surround · 30, 40 and 60-yard markings">
  </a-plane>

  <!-- Mow stripe shading — alternating bands, subtle -->
  <a-entity position="0 0.035 0">
    <a-plane rotation="-90 0 0" width="145" height="46" position="0 0 -110.5"
      material="color:#276827;opacity:0.4;transparent:true;shader:flat"></a-plane>
    <a-plane rotation="-90 0 0" width="145" height="46" position="0 0 -55"
      material="color:#2e7a2e;opacity:0.4;transparent:true;shader:flat"></a-plane>
    <a-plane rotation="-90 0 0" width="145" height="47" position="0 0 0"
      material="color:#276827;opacity:0.4;transparent:true;shader:flat"></a-plane>
    <a-plane rotation="-90 0 0" width="145" height="46" position="0 0 55"
      material="color:#2e7a2e;opacity:0.4;transparent:true;shader:flat"></a-plane>
    <a-plane rotation="-90 0 0" width="145" height="46" position="0 0 110.5"
      material="color:#276827;opacity:0.4;transparent:true;shader:flat"></a-plane>
  </a-entity>

  <!-- ── PONY TRACK — red laterite clay surround ── -->
  <a-plane position="0 0.01 -155.5" rotation="-90 0 0" width="187" height="21"
    material="color:#8b4513;roughness:0.95"></a-plane>
  <a-plane position="0 0.01 155.5"  rotation="-90 0 0" width="187" height="21"
    material="color:#8b4513;roughness:0.95"></a-plane>
  <a-plane position="-83 0.01 0"    rotation="-90 0 0" width="21" height="275"
    material="color:#8b4513;roughness:0.95"></a-plane>
  <a-plane position="83 0.01 0"     rotation="-90 0 0" width="21" height="275"
    material="color:#8b4513;roughness:0.95"></a-plane>
  <!-- Corner fills -->
  <a-cylinder position="-72.5 0.015 -144.5" radius="10.5" height="0.04" segments-radial="14"
    material="color:#8b4513;roughness:0.95"></a-cylinder>
  <a-cylinder position=" 72.5 0.015 -144.5" radius="10.5" height="0.04" segments-radial="14"
    material="color:#8b4513;roughness:0.95"></a-cylinder>
  <a-cylinder position="-72.5 0.015  144.5" radius="10.5" height="0.04" segments-radial="14"
    material="color:#8b4513;roughness:0.95"></a-cylinder>
  <a-cylinder position=" 72.5 0.015  144.5" radius="10.5" height="0.04" segments-radial="14"
    material="color:#8b4513;roughness:0.95"></a-cylinder>

  <!-- ── YARD LINES ── -->
  <!-- Side lines -->
  <a-plane position="-72 0.05 0" rotation="-90 0 90" width="277" height="0.5"
    material="color:#fff;opacity:0.85;transparent:true;shader:flat"></a-plane>
  <a-plane position=" 72 0.05 0" rotation="-90 0 90" width="277" height="0.5"
    material="color:#fff;opacity:0.85;transparent:true;shader:flat"></a-plane>
  <!-- Centre line -->
  <a-plane position="0 0.05 0"   rotation="-90 0 0" width="145" height="0.45"
    material="color:#fff;opacity:0.9;transparent:true;shader:flat"></a-plane>
  <!-- 30-yard -->
  <a-plane position="0 0.05 -82" rotation="-90 0 0" width="145" height="0.4"
    material="color:#fff;opacity:0.7;transparent:true;shader:flat"></a-plane>
  <a-plane position="0 0.05  82" rotation="-90 0 0" width="145" height="0.4"
    material="color:#fff;opacity:0.7;transparent:true;shader:flat"></a-plane>
  <!-- 40-yard -->
  <a-plane position="0 0.05 -55" rotation="-90 0 0" width="145" height="0.35"
    material="color:#fff;opacity:0.6;transparent:true;shader:flat"></a-plane>
  <a-plane position="0 0.05  55" rotation="-90 0 0" width="145" height="0.35"
    material="color:#fff;opacity:0.6;transparent:true;shader:flat"></a-plane>
  <!-- 60-yard -->
  <a-plane position="0 0.05 -27" rotation="-90 0 0" width="145" height="0.3"
    material="color:#fff;opacity:0.5;transparent:true;shader:flat"></a-plane>
  <a-plane position="0 0.05  27" rotation="-90 0 0" width="145" height="0.3"
    material="color:#fff;opacity:0.5;transparent:true;shader:flat"></a-plane>

  <!-- ── GOAL POSTS ── -->
  <a-entity position="0 0 -137.5">
    <a-cylinder position="-3.66 2.6 0" radius="0.11" height="5.2" material="color:#eee;metalness:0.4"></a-cylinder>
    <a-cylinder position=" 3.66 2.6 0" radius="0.11" height="5.2" material="color:#eee;metalness:0.4"></a-cylinder>
    <a-cylinder position="0 5.2 0" radius="0.08" height="7.6" rotation="0 0 90" material="color:#eee;metalness:0.4"></a-cylinder>
  </a-entity>
  <a-entity position="0 0 137.5">
    <a-cylinder position="-3.66 2.6 0" radius="0.11" height="5.2" material="color:#eee;metalness:0.4"></a-cylinder>
    <a-cylinder position=" 3.66 2.6 0" radius="0.11" height="5.2" material="color:#eee;metalness:0.4"></a-cylinder>
    <a-cylinder position="0 5.2 0" radius="0.08" height="7.6" rotation="0 0 90" material="color:#eee;metalness:0.4"></a-cylinder>
  </a-entity>

  <!-- ══════════════════════════════════════
       PROPOSED LAKE — North
  ══════════════════════════════════════ -->
  <a-cylinder position="0 0.06 -196" radius="46" height="0.12" segments-radial="36"
    material="color:#3d8fc8;roughness:0.05;metalness:0.55;opacity:0.9;transparent:true"
    class="clickable"
    data-lbl="Feature" data-name="Proposed Lake"
    data-desc="Ornamental crescent lake · Natural boundary between polo field and northern crescent villas">
  </a-cylinder>
  <a-plane position="0 0.07 -196" rotation="-90 0 0" width="80" height="56"
    material="color:#6abee8;opacity:0.28;transparent:true;shader:flat"></a-plane>

  <!-- ══════════════════════════════════════
       CLUBHOUSE — South (z = +185)
       From render: 3 floors, cream render,
       deep horizontal slab overhangs,
       tiered bleacher seating, twin rooftop towers,
       full-width glazing on floors 1 and 2
  ══════════════════════════════════════ -->
  <a-entity id="clubhouse" position="0 0 188"
    class="clickable"
    data-lbl="Hospitality" data-name="Clubhouse & Pavilion"
    data-desc="3-floor luxury clubhouse · 3,419 sqm · Restaurant, sports lounge, 8 skyboxes, tiered spectator stands">

    <!-- Ground floor body — piloti + entrance -->
    <a-box position="0 1.8 0" width="84" height="3.6" depth="15"
      material="color:#e8e2d6;roughness:0.7;metalness:0.02;receive-shadow:true;cast-shadow:true"></a-box>
    <!-- Ground floor glazing strip -->
    <a-box position="0 2.0 -7.6" width="70" height="2.8" depth="0.25"
      material="color:#8bbcd4;opacity:0.55;transparent:true;metalness:0.6;roughness:0.05"></a-box>

    <!-- Horizontal slab overhang — between G and F1 -->
    <a-box position="0 3.65 0" width="88" height="0.55" depth="18"
      material="color:#ddd7ca;roughness:0.65"></a-box>

    <!-- Floor 1 body — spectator terrace level -->
    <a-box position="0 6.0 0" width="84" height="4.2" depth="14"
      material="color:#e8e2d6;roughness:0.7;metalness:0.02;cast-shadow:true"></a-box>
    <!-- Floor 1 full-width glazing facing field -->
    <a-box position="0 6.0 -7.1" width="78" height="3.4" depth="0.25"
      material="color:#8bbcd4;opacity:0.6;transparent:true;metalness:0.65;roughness:0.05"></a-box>
    <!-- Floor 1 terrace rail (dark timber balustrade from render) -->
    <a-box position="0 4.15 -7.6" width="82" height="0.9" depth="0.4"
      material="color:#6b4a2a;roughness:0.8"></a-box>

    <!-- Horizontal slab overhang — between F1 and F2 -->
    <a-box position="0 8.35 0" width="88" height="0.55" depth="18"
      material="color:#ddd7ca;roughness:0.65"></a-box>

    <!-- Floor 2 body -->
    <a-box position="0 10.5 0" width="84" height="4.0" depth="13"
      material="color:#e8e2d6;roughness:0.7;metalness:0.02"></a-box>
    <!-- Floor 2 glazing -->
    <a-box position="0 10.5 -6.6" width="78" height="3.2" depth="0.25"
      material="color:#8bbcd4;opacity:0.6;transparent:true;metalness:0.65;roughness:0.05"></a-box>

    <!-- Top slab -->
    <a-box position="0 12.7 0" width="88" height="0.55" depth="18"
      material="color:#ddd7ca;roughness:0.65"></a-box>

    <!-- Twin rooftop pavilion towers (signature from render) -->
    <a-box position="-22 15.5 0" width="14" height="5.5" depth="12"
      material="color:#e8e2d6;roughness:0.7"></a-box>
    <a-box position=" 22 15.5 0" width="14" height="5.5" depth="12"
      material="color:#e8e2d6;roughness:0.7"></a-box>
    <!-- Tower glazing -->
    <a-box position="-22 15.5 -6.2" width="12" height="4" depth="0.2"
      material="color:#8bbcd4;opacity:0.6;transparent:true;metalness:0.6;roughness:0.05"></a-box>
    <a-box position=" 22 15.5 -6.2" width="12" height="4" depth="0.2"
      material="color:#8bbcd4;opacity:0.6;transparent:true;metalness:0.6;roughness:0.05"></a-box>

    <!-- Vertical columns — structural pillars visible in render -->
    <a-entity>
      <a-cylinder position="-38 6.5 -7.5" radius="0.55" height="13" material="color:#ddd7ca;roughness:0.7"></a-cylinder>
      <a-cylinder position="-25 6.5 -7.5" radius="0.55" height="13" material="color:#ddd7ca;roughness:0.7"></a-cylinder>
      <a-cylinder position="-12 6.5 -7.5" radius="0.55" height="13" material="color:#ddd7ca;roughness:0.7"></a-cylinder>
      <a-cylinder position="  0 6.5 -7.5" radius="0.55" height="13" material="color:#ddd7ca;roughness:0.7"></a-cylinder>
      <a-cylinder position=" 12 6.5 -7.5" radius="0.55" height="13" material="color:#ddd7ca;roughness:0.7"></a-cylinder>
      <a-cylinder position=" 25 6.5 -7.5" radius="0.55" height="13" material="color:#ddd7ca;roughness:0.7"></a-cylinder>
      <a-cylinder position=" 38 6.5 -7.5" radius="0.55" height="13" material="color:#ddd7ca;roughness:0.7"></a-cylinder>
    </a-entity>

    <!-- Bleacher seating (tiered steps facing field) -->
    <a-box position="0 0.4  -9.5" width="82" height="0.8" depth="3.5" material="color:#c8c2b5;roughness:0.85"></a-box>
    <a-box position="0 1.1  -11.2" width="82" height="0.8" depth="3"   material="color:#c0bab0;roughness:0.85"></a-box>
    <a-box position="0 1.8  -12.8" width="82" height="0.8" depth="2.8" material="color:#b8b2a8;roughness:0.85"></a-box>
    <a-box position="0 2.5  -14.2" width="82" height="0.8" depth="2.6" material="color:#b0aaa0;roughness:0.85"></a-box>

    <!-- Parasol umbrellas on terrace (from render) -->
    <a-cone position="-24 8.8 -5" radius-bottom="2.8" radius-top="0.1" height="0.5"
      material="color:#e8dfc0;roughness:0.8;shader:flat"></a-cone>
    <a-cone position="  0 8.8 -5" radius-bottom="2.8" radius-top="0.1" height="0.5"
      material="color:#e8dfc0;roughness:0.8;shader:flat"></a-cone>
    <a-cone position=" 24 8.8 -5" radius-bottom="2.8" radius-top="0.1" height="0.5"
      material="color:#e8dfc0;roughness:0.8;shader:flat"></a-cone>

<script>
/* ═══════════════════════════════════════════════════
   VIEWPOINTS & INTERACTION
════════════════════════════════════════════════════ */
const VPS = {
  centre:   { p:[0,    1.65, 0],    r:[0,  0,   0] },
  clubhouse:{ p:[0,    4.5,  165],  r:[-4, 180, 0] },
  lake:     { p:[0,    1.65, -155], r:[0,  0,   0] },
  'villa-w':{ p:[-90,  1.65, 0],    r:[0,  90,  0] },
  'villa-e':{ p:[90,   1.65, 0],    r:[0,  270, 0] },
  stables:  { p:[-150, 1.65, 120],  r:[0,  30,  0] },
};

let cur = 'centre';
let hinted = false;

const ZONE_DATA = {
  'polo-field':{ lbl:'Main Field',   name:'International Polo Field',   desc:'FIP-standard · 275m × 145m · Red laterite clay pony track · 30/40/60-yard markings' },
  'lake':      { lbl:'Feature',      name:'Proposed Lake',              desc:'Ornamental crescent lake · Natural estate boundary · Visual focal point north of field' },
  'clubhouse': { lbl:'Hospitality',  name:'Clubhouse & Pavilion',       desc:'3-floor luxury clubhouse · 3,419 sqm · Sports lounge, restaurant, 8 skyboxes, spectator stands' },
  'villa-w':   { lbl:'Residential',  name:'Premium Villa — West',       desc:'3-bed polo-view · 330 sqm · Undercroft parking · Glass balustrades · Blonde timber louvres' },
  'villa-e':   { lbl:'Residential',  name:'Premium Villa — East',       desc:'3-bed lake-view · 330 sqm · Timber louvre screens · Direct polo field sightlines' },
  'apt':       { lbl:'Residential',  name:'Loft Apartment Block',       desc:'2-bed loft terrace · 125 sqm · 96 units · Signature curved wing roofline · Timber centre panels' },
  'stables':   { lbl:'Equestrian',   name:'Horse Stables',              desc:'4 blocks · 56 stalls · Red laterite brick · Exposed timber trusses · Terracotta tiled roof' },
  'training':  { lbl:'Equestrian',   name:'Training Field',             desc:'Polo academy · 5,000 sqm · Practice zones · Adjacent to stables and quarantine paddocks' },
  'crescent':  { lbl:'Residential',  name:'Crescent Villa',             desc:'Northern arc residence · Overlooks ornamental lake and polo field · Premium position' },
};

/* ── Viewpoint navigation ── */
function go(id) {
  const vp = VPS[id]; if (!vp) return;
  cur = id;
  document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('on'));
  const btn = document.getElementById('vb-' + id);
  if (btn) btn.classList.add('on');

  const rig = document.getElementById('rig');
  rig.setAttribute('animation', {
    property: 'position',
    to: vp.p.join(' '),
    dur: 1000,
    easing: 'easeInOutCubic',
  });
  document.getElementById('cam').setAttribute('rotation', `${vp.r[0]} ${vp.r[1]} ${vp.r[2]}`);
  dismiss();

  // Show contextual info
  const id2zone = {
    centre:'polo-field', clubhouse:'clubhouse', lake:'lake',
    'villa-w':'villa-w', 'villa-e':'villa-e', stables:'stables',
  };
  showInfo(ZONE_DATA[id2zone[id]]);
}

function showInfo(z) {
  if (!z) return;
  document.getElementById('zl').textContent = z.lbl;
  document.getElementById('zn').textContent = z.name;
  document.getElementById('zd').textContent = z.desc;
  const zi = document.getElementById('zi');
  zi.classList.add('show');
  clearTimeout(zi._t);
  zi._t = setTimeout(() => zi.classList.remove('show'), 5500);
}

function dismiss() {
  if (hinted) return;
  hinted = true;
  document.getElementById('hint').classList.add('gone');
}

/* ── Clickable zone interaction ── */
function setupClicks() {
  document.querySelectorAll('.clickable').forEach(el => {
    el.addEventListener('click', function() {
      const zone = this.getAttribute('data-zone') || this.closest('[data-zone]')?.getAttribute('data-zone');
      const lbl  = this.getAttribute('data-lbl');
      const name = this.getAttribute('data-name');
      const desc = this.getAttribute('data-desc');
      if (name) showInfo({ lbl: lbl||'Zone', name, desc });

      // Hover glow — brief gold emissive
      this.setAttribute('material', 'emissive', '#C9A84C');
      this.setAttribute('material', 'emissiveIntensity', '0.12');
      setTimeout(() => {
        this.setAttribute('material', 'emissive', '#000000');
        this.setAttribute('material', 'emissiveIntensity', '0');
      }, 700);
      dismiss();
    });
  });
}

/* ── Build villas procedurally ── */
function buildVillas() {
  const scene = document.querySelector('a-scene');

  function makeVilla(parentEl, px, pz, flip) {
    const g = document.createElement('a-entity');
    g.setAttribute('position', `${px} 0 ${pz}`);
    g.setAttribute('class', 'clickable');
    g.setAttribute('data-lbl', 'Residential');
    g.setAttribute('data-name', flip ? 'Premium Villa — East' : 'Premium Villa — West');
    g.setAttribute('data-desc', '3-bed polo-view villa · 330 sqm · Timber louvre screens · Glass balustrades · Undercroft parking');

    const faceZ = flip ? 1 : -1; // east villas face west (-x), west villas face east (+x)

    // Undercroft / piloti base — concrete grey
    const base = document.createElement('a-box');
    base.setAttribute('position', `0 1.2 0`);
    base.setAttribute('width', '10'); base.setAttribute('height', '2.4'); base.setAttribute('depth', '10');
    base.setAttribute('material', 'color:#b0aba2;roughness:0.85;cast-shadow:true');
    g.appendChild(base);

    // Floor 0 carport opening (darker)
    const port = document.createElement('a-box');
    port.setAttribute('position', `0 0.9 ${faceZ * -4.5}`);
    port.setAttribute('width', '7'); port.setAttribute('height', '1.8'); port.setAttribute('depth', '0.25');
    port.setAttribute('material', 'color:#222;opacity:0.7;transparent:true;shader:flat');
    g.appendChild(port);

    // Slab between ground and floor 1
    const slab0 = document.createElement('a-box');
    slab0.setAttribute('position', `0 2.55 0`);
    slab0.setAttribute('width', '11'); slab0.setAttribute('height', '0.45'); slab0.setAttribute('depth', '11');
    slab0.setAttribute('material', 'color:#c8c3ba;roughness:0.7');
    g.appendChild(slab0);

    // Floor 1 — white/grey concrete body
    const f1 = document.createElement('a-box');
    f1.setAttribute('position', `0 5.5 0`);
    f1.setAttribute('width', '10'); f1.setAttribute('height', '5.5'); f1.setAttribute('depth', '10');
    f1.setAttribute('material', 'color:#d4d0c8;roughness:0.7;cast-shadow:true');
    g.appendChild(f1);

    // Floor 1 — timber louvre panel (left half of facade)
    const slat1 = document.createElement('a-box');
    slat1.setAttribute('position', `-2.5 5.5 ${faceZ * -5.1}`);
    slat1.setAttribute('width', '4'); slat1.setAttribute('height', '4.5'); slat1.setAttribute('depth', '0.3');
    slat1.setAttribute('material', 'color:#c89040;roughness:0.78');
    g.appendChild(slat1);

    // Floor 1 — glazing right half
    const glz1 = document.createElement('a-box');
    glz1.setAttribute('position', `2.5 5.5 ${faceZ * -5.15}`);
    glz1.setAttribute('width', '4'); glz1.setAttribute('height', '3.8'); glz1.setAttribute('depth', '0.2');
    glz1.setAttribute('material', 'color:#7ab8d4;opacity:0.55;transparent:true;metalness:0.65;roughness:0.05');
    g.appendChild(glz1);

    // Floor 1 — glass balustrade
    const rail1 = document.createElement('a-box');
    rail1.setAttribute('position', `0 3.0 ${faceZ * -5.2}`);
    rail1.setAttribute('width', '9'); rail1.setAttribute('height', '0.9'); rail1.setAttribute('depth', '0.15');
    rail1.setAttribute('material', 'color:#aaddee;opacity:0.35;transparent:true;metalness:0.6;roughness:0.05');
    g.appendChild(rail1);

    // Slab between F1 and F2
    const slab1 = document.createElement('a-box');
    slab1.setAttribute('position', `0 8.35 0`);
    slab1.setAttribute('width', '11.5'); slab1.setAttribute('height', '0.45'); slab1.setAttribute('depth', '11.5');
    slab1.setAttribute('material', 'color:#c8c3ba;roughness:0.7');
    g.appendChild(slab1);

    // Floor 2 — timber louvre full facade + glazing
    const f2 = document.createElement('a-box');
    f2.setAttribute('position', `0 11.2 0`);
    f2.setAttribute('width', '10'); f2.setAttribute('height', '5.5'); f2.setAttribute('depth', '10');
    f2.setAttribute('material', 'color:#d4d0c8;roughness:0.7');
    g.appendChild(f2);

    // Floor 2 timber panel — full width
    const slat2 = document.createElement('a-box');
    slat2.setAttribute('position', `0 11.2 ${faceZ * -5.1}`);
    slat2.setAttribute('width', '8'); slat2.setAttribute('height', '4.5'); slat2.setAttribute('depth', '0.3');
    slat2.setAttribute('material', 'color:#c89040;roughness:0.78');
    g.appendChild(slat2);

    // Floor 2 glass
    const glz2 = document.createElement('a-box');
    glz2.setAttribute('position', `0 11.4 ${faceZ * -5.15}`);
    glz2.setAttribute('width', '8'); glz2.setAttribute('height', '3.2'); glz2.setAttribute('depth', '0.2');
    glz2.setAttribute('material', 'color:#7ab8d4;opacity:0.55;transparent:true;metalness:0.65;roughness:0.05');
    g.appendChild(glz2);

    // Flat roof slab
    const roof = document.createElement('a-box');
    roof.setAttribute('position', `0 14.3 0`);
    roof.setAttribute('width', '11'); roof.setAttribute('height', '0.5'); roof.setAttribute('depth', '11');
    roof.setAttribute('material', 'color:#c4bfb8;roughness:0.7');
    g.appendChild(roof);

    parentEl.appendChild(g);
  }

  // West villas: x = -102, z from -78 to +78 step 12, face east (faceDir = false)
  const wParent = document.querySelector('#villas-w > a-entity');
  for (let i = 0; i < 14; i++) {
    makeVilla(wParent, 0, -78 + i * 12, false);
  }

  // East villas: x = +102, z from -78 to +78 step 12, face west (flip = true)
  const eParent = document.querySelector('#villas-e > a-entity');
  for (let i = 0; i < 14; i++) {
    makeVilla(eParent, 0, -78 + i * 12, true);
  }
}

/* ── Build crescent villas ── */
function buildCrescent() {
  const parent = document.getElementById('crescent');
  const positions = [
    [-55,-228], [-40,-238], [-24,-244], [-8,-246],
    [8,-246],   [24,-244],  [40,-238],  [55,-228],

  positions.forEach(([x, z]) => {
    // Simple 2-storey cream villa
    const g = document.createElement('a-entity');

    g.setAttribute('class', 'clickable');
    g.setAttribute('data-lbl', 'Residential');
    g.setAttribute('data-name', 'Crescent Villa');
    g.setAttribute('data-desc', 'Northern crescent · Lake and polo field views · Premium arc position');

    const body = document.createElement('a-box');

    body.setAttribute('material', 'color:#d8d4cc;roughness:0.75;cast-shadow:true');
    g.appendChild(body);

    const timber = document.createElement('a-box');
    timber.setAttribute('position', '0 4.5 -4.6');
    timber.setAttribute('width', '5'); timber.setAttribute('height', '4'); timber.setAttribute('depth', '0.25');
    timber.setAttribute('material', 'color:#c08030;roughness:0.78');
    g.appendChild(timber);

    const roof = document.createElement('a-box');
    roof.setAttribute('position', '0 7.3 0');
    roof.setAttribute('width', '9'); roof.setAttribute('height', '0.4'); roof.setAttribute('depth', '10');
    roof.setAttribute('material', 'color:#c8c3ba;roughness:0.7');
    g.appendChild(roof);

    parent.appendChild(g);
  });
}

/* ── Procedural trees ── */
function buildTrees() {
  const TRUNK = '#5a3510';

  function tree(parent, x, z) {
    const h = 9 + Math.random() * 7;
    const r = 3.2 + Math.random() * 2;

    const g = document.createElement('a-entity');
    g.setAttribute('position', `${x} 0 ${z}`);

    // Trunk
    const trunk = document.createElement('a-cylinder');
    trunk.setAttribute('position', `0 ${h * 0.22} 0`);
    trunk.setAttribute('radius', '0.4');
    trunk.setAttribute('height', `${h * 0.44}`);
    trunk.setAttribute('material', `color:${TRUNK};roughness:0.95`);
    g.appendChild(trunk);

    // 3-tier canopy for tropical fullness
    [[0, 1.0, r], [h*0.28, 0.75, r*0.8], [h*0.48, 0.55, r*0.55]].forEach(([yo, hs, rc]) => {
      const cone = document.createElement('a-cone');
      cone.setAttribute('position', `0 ${h * 0.45 + yo} 0`);
      cone.setAttribute('radius-bottom', `${rc}`);
      cone.setAttribute('radius-top', '0.15');
      cone.setAttribute('height', `${h * hs * 0.55}`);
      cone.setAttribute('segments-radial', '8');
      const green = Math.floor(90 + Math.random() * 28);
      cone.setAttribute('material', `color:rgb(18,${green},18);roughness:0.95`);
      g.appendChild(cone);
    });

    parent.appendChild(g);
  }

  const ts = document.getElementById('trees-s');
  const tn = document.getElementById('trees-n');
  const tw = document.getElementById('trees-w');
  const te = document.getElementById('trees-e');

  // South
  for (let x = -220; x <= 220; x += 12) tree(ts, x + (Math.random()-0.5)*4, 232 + Math.random()*10);
  // North
  for (let x = -220; x <= 220; x += 11) tree(tn, x + (Math.random()-0.5)*4, -268 + Math.random()*10);
  // West
  for (let z = -265; z <= 230; z += 12) tree(tw, -200 + Math.random()*10, z + (Math.random()-0.5)*4);
  // East
  for (let z = -265; z <= 230; z += 12) tree(te, 195 + Math.random()*10, z + (Math.random()-0.5)*4);

  // Palms flanking clubhouse (from render)
  [-46,-34,34,46].forEach(x => {
    const g = document.createElement('a-entity');
    g.setAttribute('position', `${x} 0 178`);
    const trunk = document.createElement('a-cylinder');
    trunk.setAttribute('position', '0 7 0'); trunk.setAttribute('radius', '0.3');
    trunk.setAttribute('height', '14'); trunk.setAttribute('material', 'color:#7a5520;roughness:0.9');
    // Slight lean
    trunk.setAttribute('rotation', `${(Math.random()-0.5)*8} 0 ${(Math.random()-0.5)*6}`);
    g.appendChild(trunk);
    // Palm frond burst — 6 drooping planes
    for (let i = 0; i < 6; i++) {
      const frond = document.createElement('a-plane');
      const ang = i * 60;
      frond.setAttribute('position', `${Math.sin(ang*Math.PI/180)*2.5} 14 ${Math.cos(ang*Math.PI/180)*2.5}`);
      frond.setAttribute('rotation', `${-35 + Math.random()*15} ${ang} 0`);
      frond.setAttribute('width', '0.5'); frond.setAttribute('height', '4.5');
      frond.setAttribute('material', 'color:#2a7a1a;roughness:0.9;side:double');
      g.appendChild(frond);
    }
    document.querySelector('a-scene').appendChild(g);
  });

  // Palms near stables (from render)
  [[-148,118],[-162,128],[-155,158],[-172,148]].forEach(([x,z]) => {
    const g = document.createElement('a-entity');
    g.setAttribute('position', `${x} 0 ${z}`);
    const h = 11 + Math.random()*4;
    const tr = document.createElement('a-cylinder');
    tr.setAttribute('position', `0 ${h/2} 0`); tr.setAttribute('radius', '0.32');
    tr.setAttribute('height', `${h}`); tr.setAttribute('material', 'color:#7a5520;roughness:0.9');
    g.appendChild(tr);
    for (let i = 0; i < 6; i++) {
      const ang = i * 60;
      const frond = document.createElement('a-plane');
      frond.setAttribute('position', `${Math.sin(ang*Math.PI/180)*2} ${h} ${Math.cos(ang*Math.PI/180)*2}`);
      frond.setAttribute('rotation', `${-30} ${ang} 0`);
      frond.setAttribute('width', '0.5'); frond.setAttribute('height', '4');
      frond.setAttribute('material', 'color:#2a7a1a;roughness:0.9;side:double');
      g.appendChild(frond);
    }
    document.querySelector('a-scene').appendChild(g);
  });
}

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  const order = ['centre','clubhouse','lake','villa-w','villa-e','stables'];
  const i = order.indexOf(cur);
  if (e.key==='ArrowRight') go(order[(i+1)%order.length]);
  if (e.key==='ArrowLeft')  go(order[(i-1+order.length)%order.length]);
  if (e.key==='Escape')     window.location.href = 'index.html';
  dismiss();
});

/* ── Scene loaded ── */
document.querySelector('a-scene').addEventListener('loaded', () => {
  buildVillas();
  buildCrescent();
  buildTrees();
  setupClicks();

  setTimeout(() => {
    document.getElementById('loader').classList.add('fade');
    document.getElementById('top-nav').classList.add('show');
    document.getElementById('vp').classList.add('show');
    setTimeout(() => document.getElementById('loader').remove(), 900);
  }, 900);

  setTimeout(dismiss, 8000);
});
</script>
</body>
</html>
