<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Project XIX — Polo Field</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1C3A2A;--gold:#C9A84C;--cream:#F5F0E8}
body{background:#0a1008;overflow:hidden;font-family:'Inter',sans-serif}
#c{display:block;width:100vw;height:100vh}

/* Loader */
#loader{position:fixed;inset:0;z-index:200;background:#0a1008;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .9s ease}
#loader.out{opacity:0;pointer-events:none}
.lt{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;
  color:var(--cream);letter-spacing:.1em;margin-bottom:5px}
.lt span{color:var(--gold)}
.ls{font-size:9px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(245,240,232,.28);margin-bottom:52px}
.lb{width:140px;height:1px;background:rgba(255,255,255,.07);overflow:hidden}
.lp{height:100%;width:0%;background:var(--gold);transition:width .1s linear}

/* Nav */
#nav{position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;padding:0 20px;height:52px;
  background:rgba(6,14,6,.88);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(201,168,76,.12);
  opacity:0;transition:opacity .5s ease}
#nav.show{opacity:1}
.nbk{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(245,240,232,.5);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:5px;padding:5px 12px;cursor:pointer;text-decoration:none;transition:all .2s}
.nbk:hover{color:var(--cream);background:rgba(255,255,255,.1)}
.nbk svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round}
.ntitle{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:300;
  color:var(--cream);position:absolute;left:50%;transform:translateX(-50%)}
.nbadge{font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);border:1px solid rgba(201,168,76,.28);border-radius:3px;
  padding:3px 8px;margin-left:auto}

/* Crosshair */
#xhair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;z-index:50;opacity:.35}
#xhair::before,#xhair::after{content:'';position:absolute;background:var(--gold)}
#xhair::before{width:14px;height:1px;top:0;left:-7px}
#xhair::after{width:1px;height:14px;top:-7px;left:0}

/* Hint */
#hint{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:8px;
  background:rgba(6,14,6,.85);backdrop-filter:blur(10px);
  border:1px solid rgba(201,168,76,.16);border-radius:40px;
  padding:8px 18px;font-size:11px;color:rgba(245,240,232,.45);
  white-space:nowrap;pointer-events:none;transition:opacity .6s}
#hint.gone{opacity:0}

/* Zone info */
#zi{position:fixed;top:64px;right:16px;z-index:100;
  background:rgba(6,14,6,.92);backdrop-filter:blur(14px);
  border:1px solid rgba(201,168,76,.2);border-radius:10px;
  padding:14px 16px;max-width:215px;
  opacity:0;transition:opacity .35s;pointer-events:none}
#zi.on{opacity:1}
.zl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(201,168,76,.6);margin-bottom:4px}
.zn{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;
  color:var(--cream);margin-bottom:5px;line-height:1.2}
.zd{font-size:11px;color:rgba(245,240,232,.38);line-height:1.55}

/* Viewpoint strip */
#vp{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(6,14,6,.92);backdrop-filter:blur(18px);
  border-top:1px solid rgba(201,168,76,.13);
  padding:11px 18px 20px;
  opacity:0;transition:opacity .5s ease .5s}
#vp.show{opacity:1}
.vplbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,240,232,.22);margin-bottom:9px}
.vprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.vprow::-webkit-scrollbar{display:none}
.vpb{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 14px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);border-radius:7px;
  cursor:pointer;transition:all .2s;min-width:80px;color:rgba(245,240,232,.4)}
.vpb:hover{background:rgba(255,255,255,.08);border-color:rgba(201,168,76,.3)}
.vpb.on{background:rgba(201,168,76,.09);border-color:#C9A84C;color:#C9A84C}
.vpic{font-size:16px;line-height:1}
.vpb svg{width:22px;height:22px;stroke:rgba(245,240,232,.38);fill:none;
  stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.vpb.on svg{stroke:#C9A84C}
.vpnm{font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  text-align:center;line-height:1.35;color:rgba(245,240,232,.4);transition:color .2s}
.vpb.on .vpnm{color:#C9A84C}

/* ── Radar minimap ── */
#radar{
  position:fixed;bottom:96px;right:16px;z-index:100;
  width:160px;height:104px;border-radius:10px;overflow:hidden;
  border:1px solid rgba(201,168,76,.22);
  background:rgba(6,14,6,.82);backdrop-filter:blur(10px);
  opacity:0;transition:opacity .5s ease 1s;
}
#radar.show{opacity:1}
#radar-canvas{display:block;width:160px;height:104px}
#radar-lbl{
  position:absolute;top:5px;left:8px;
  font-size:8px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(201,168,76,.5);pointer-events:none;
}
#radar-coords{
  position:absolute;bottom:5px;left:8px;right:8px;
  font-size:7px;letter-spacing:.06em;
  color:rgba(245,240,232,.28);font-family:'Inter',monospace;
  pointer-events:none;
}

/* ── Movement mode badge ── */
#mode-badge{
  position:fixed;top:64px;left:50%;transform:translateX(-50%);
  z-index:100;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(201,168,76,.6);background:rgba(6,14,6,.82);
  border:1px solid rgba(201,168,76,.2);border-radius:20px;
  padding:5px 14px;opacity:0;transition:opacity .3s;pointer-events:none;
}
#mode-badge.show{opacity:1}

/* ── Touch joystick — mobile ── */
#joy-move{
  position:fixed;bottom:120px;left:24px;z-index:100;
  width:90px;height:90px;border-radius:50%;
  background:rgba(6,14,6,.45);border:1px solid rgba(201,168,76,.2);
  display:none;touch-action:none;
}
#joy-move-knob{
  position:absolute;width:34px;height:34px;border-radius:50%;
  background:rgba(201,168,76,.4);border:1px solid rgba(201,168,76,.6);
  top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;transition:background .15s;
}
@media(pointer:coarse){#joy-move{display:block}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="loader">
  <div class="lt">PROJECT <span>XIX</span></div>
  <div class="ls">Polo Field · Ground Level</div>
  <div class="lb"><div class="lp" id="lp"></div></div>
</div>

<nav id="nav">
  <a class="nbk" href="index.html">
    <svg viewBox="0 0 16 16"><path d="M10 12L6 8l4-4"/></svg>
    Masterplan
  </a>
  <div class="ntitle">Polo Field</div>
  <div class="nbadge">3D · LIVE</div>
</nav>

<div id="xhair"></div>
<div id="hint">Drag to look · W A S D to walk · Click canvas to lock mouse for free look</div>

<div id="zi">
  <div class="zl" id="zl">Zone</div>
  <div class="zn" id="zn"></div>
  <div class="zd" id="zd"></div>
</div>

<div id="vp">
  <div class="vplbl">Standing points</div>
  <div class="vprow">

    <!-- Centre Field -->
    <button class="vpb on" id="vb0" onclick="goVP(0)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="1"/>
        <line x1="12" y1="3" x2="12" y2="21"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <circle cx="12" cy="12" r="2.5"/>
      </svg>
      <div class="vpnm">Centre<br>Field</div>
    </button>

    <!-- Clubhouse -->
    <button class="vpb" id="vb1" onclick="goVP(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21V10l9-7 9 7v11"/>
        <line x1="3" y1="14" x2="21" y2="14"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
        <rect x="9" y="17" width="6" height="4"/>
      </svg>
      <div class="vpnm">Club<br>House</div>
    </button>

    <!-- Pony Line -->
    <button class="vpb" id="vb2" onclick="goVP(2)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="8" width="20" height="8" rx="1"/>
        <line x1="6" y1="8" x2="6" y2="16"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="18" y1="8" x2="18" y2="16"/>
        <path d="M2 12h20"/>
      </svg>
      <div class="vpnm">Pony<br>Line</div>
    </button>

    <!-- Lake End -->
    <button class="vpb" id="vb3" onclick="goVP(3)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 16c1.5-2 3-2 4.5 0s3 2 4.5 0 3-2 4.5 0 3 2 4.5 0"/>
        <path d="M2 12c1.5-2 3-2 4.5 0s3 2 4.5 0 3-2 4.5 0 3 2 4.5 0"/>
        <path d="M7 8C9 5 12 4 15 6"/>
        <circle cx="17" cy="5" r="2"/>
      </svg>
      <div class="vpnm">Lake<br>End</div>
    </button>

    <!-- Villa West -->
    <button class="vpb" id="vb4" onclick="goVP(4)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="10" width="18" height="11" rx="1"/>
        <path d="M3 10l9-7 9 7"/>
        <line x1="9" y1="21" x2="9" y2="14"/>
        <line x1="15" y1="21" x2="15" y2="14"/>
        <rect x="10" y="13" width="4" height="3" rx="0.5"/>
      </svg>
      <div class="vpnm">Villa<br>West</div>
    </button>

    <!-- Stables — links to stables.html -->
    <button class="vpb" id="vb5" onclick="window.location.href='stables.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 20V10l10-7 10 7v10"/>
        <path d="M2 14h20"/>
        <line x1="8" y1="14" x2="8" y2="20"/>
        <line x1="16" y1="14" x2="16" y2="20"/>
        <path d="M8 10c0-2.2 1.8-4 4-4s4 1.8 4 4"/>
      </svg>
      <div class="vpnm">Stables<br>↗</div>
    </button>

  </div>
</div>

<!-- Radar minimap -->
<div id="radar">
  <canvas id="radar-canvas" width="320" height="208"></canvas>
  <div id="radar-lbl">Site Map</div>
  <div id="radar-coords" id="radar-coords"></div>
</div>

<!-- Movement mode badge -->
<div id="mode-badge">Free Walk · Click to lock mouse</div>

<!-- Touch joystick (mobile) -->
<div id="joy-move"><div id="joy-move-knob"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* ═══════════════════════════════════════════════
   SCENE SETUP
═══════════════════════════════════════════════ */
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'),
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc8e8b8, 220, 480);

const camera = new THREE.PerspectiveCamera(68, W/H, 0.1, 600);
camera.position.set(0, 1.65, 0);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

/* ═══════════════════════════════════════════════
   SKY — procedural Preetham sky
   Lagos golden afternoon: sun low-ish south-west
═══════════════════════════════════════════════ */
const sky = new Sky();
sky.scale.setScalar(490);
scene.add(sky);
const sun = new THREE.Vector3();
const skyUni = sky.material.uniforms;
skyUni['turbidity'].value = 5.5;       // slight harmattan haze
skyUni['rayleigh'].value = 1.8;        // blue scattering
skyUni['mieCoefficient'].value = 0.04;
skyUni['mieDirectionalG'].value = 0.88;
// Sun position: elevation 28°, azimuth 225° (south-west)
const phi = THREE.MathUtils.degToRad(90 - 28);
const theta = THREE.MathUtils.degToRad(225);
sun.setFromSphericalCoords(1, phi, theta);
skyUni['sunPosition'].value.copy(sun);

/* ═══════════════════════════════════════════════
   LIGHTING — physically correct
═══════════════════════════════════════════════ */
// Ambient — sky blue fill
const ambient = new THREE.HemisphereLight(0xb8d8ff, 0x8b5a20, 0.55);
scene.add(ambient);

// Key sun — warm golden afternoon
const sunLight = new THREE.DirectionalLight(0xffe4a0, 2.8);
sunLight.position.set(-80, 120, 100);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 700;
sunLight.shadow.camera.left = -260;
sunLight.shadow.camera.right = 260;
sunLight.shadow.camera.top = 260;
sunLight.shadow.camera.bottom = -260;
sunLight.shadow.bias = -0.0003;
sunLight.shadow.normalBias = 0.02;
scene.add(sunLight);

// Fill — soft blue from opposite side
const fill = new THREE.DirectionalLight(0xc0d8ff, 0.55);
fill.position.set(60, 40, -60);
scene.add(fill);

/* ═══════════════════════════════════════════════
   TEXTURE FACTORY — creates PBR materials
═══════════════════════════════════════════════ */
const TL = new THREE.TextureLoader();

// Procedural canvas texture helper
function canvasTex(w, h, fn) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  fn(cv.getContext('2d'));
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// Grass texture — hand-painted in canvas
const grassTex = canvasTex(512, 512, ctx => {
  const g = ctx.createLinearGradient(0,0,512,512);
  g.addColorStop(0,'#2d7a2a'); g.addColorStop(0.5,'#237020');
  g.addColorStop(1,'#2d7a2a');
  ctx.fillStyle = g; ctx.fillRect(0,0,512,512);
  // Blade texture noise
  for(let i=0;i<4000;i++){
    ctx.strokeStyle=`rgba(${10+Math.random()*30},${100+Math.random()*40},${10+Math.random()*20},0.18)`;
    ctx.lineWidth=0.5;
    ctx.beginPath();
    const x=Math.random()*512,y=Math.random()*512;
    ctx.moveTo(x,y); ctx.lineTo(x+(Math.random()-0.5)*3,y-3-Math.random()*6);
    ctx.stroke();
  }
});
grassTex.repeat.set(24, 48);

// Laterite clay texture
const lateriteTex = canvasTex(256, 256, ctx => {
  ctx.fillStyle='#8b4020'; ctx.fillRect(0,0,256,256);
  for(let i=0;i<3000;i++){
    const x=Math.random()*256,y=Math.random()*256;
    ctx.fillStyle=`rgba(${100+Math.random()*60},${35+Math.random()*25},${5+Math.random()*15},0.3)`;
    ctx.fillRect(x,y,1+Math.random()*2,1+Math.random()*2);
  }
});
lateriteTex.repeat.set(18, 32);

// Cream concrete texture (clubhouse / villas)
const concreteTex = canvasTex(256, 256, ctx => {
  ctx.fillStyle='#e2ddd5'; ctx.fillRect(0,0,256,256);
  for(let i=0;i<1200;i++){
    const v=Math.random()*20-10;
    ctx.fillStyle=`rgba(${128+v},${124+v},${118+v},0.12)`;
    ctx.fillRect(Math.random()*256,Math.random()*256,Math.random()*4,Math.random()*4);
  }
});
concreteTex.repeat.set(4, 4);

// Timber louvre texture (warm blonde oak)
const timberTex = canvasTex(128, 256, ctx => {
  for(let y=0;y<256;y++){
    const t=y/256;
    const r=Math.floor(190+t*25+Math.random()*8);
    const g=Math.floor(130+t*15+Math.random()*8);
    const b=Math.floor(45+t*10+Math.random()*5);
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fillRect(0,y,128,1);
  }
  // Grain lines
  for(let i=0;i<80;i++){
    ctx.strokeStyle=`rgba(60,30,5,0.07)`;
    ctx.lineWidth=0.4;
    ctx.beginPath();
    ctx.moveTo(Math.random()*128,0);
    ctx.lineTo(Math.random()*128+4,256);
    ctx.stroke();
  }
});
timberTex.repeat.set(3, 1);

// Red laterite brick (stables)
const brickTex = canvasTex(256, 256, ctx => {
  ctx.fillStyle='#c04820'; ctx.fillRect(0,0,256,256);
  // Brick courses
  for(let row=0;row<12;row++){
    const y=row*22;
    const offset=(row%2)*32;
    for(let col=-1;col<7;col++){
      const x=col*64+offset;
      const r=180+Math.random()*40,g=60+Math.random()*25,b=15+Math.random()*15;
      ctx.fillStyle=`rgb(${r},${g},${b})`;
      ctx.fillRect(x+1,y+1,61,19);
      ctx.fillStyle='rgba(60,20,5,0.25)';
      ctx.fillRect(x,y,64,1); ctx.fillRect(x,y,1,22); // mortar
    }
  }
});
brickTex.repeat.set(3, 2);

// Cobblestone (stables yard)
const cobbleTex = canvasTex(256, 256, ctx => {
  ctx.fillStyle='#9a8870'; ctx.fillRect(0,0,256,256);
  for(let i=0;i<200;i++){
    const x=Math.random()*256,y=Math.random()*256;
    const r=16+Math.random()*24,rx=r*(0.6+Math.random()*0.8),ry=r*(0.5+Math.random()*0.7);
    const v=140+Math.random()*40;
    ctx.fillStyle=`rgb(${v},${v-10},${v-20})`;
    ctx.beginPath(); ctx.ellipse(x,y,rx,ry,Math.random()*Math.PI,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(60,50,40,0.35)'; ctx.lineWidth=1.2;
    ctx.stroke();
  }
});
cobbleTex.repeat.set(4, 4);

// Water texture
const waterTex = canvasTex(256, 256, ctx => {
  const g = ctx.createLinearGradient(0,0,256,256);
  g.addColorStop(0,'#2a7ec8'); g.addColorStop(0.5,'#4898d8');
  g.addColorStop(1,'#1a6ab8');
  ctx.fillStyle=g; ctx.fillRect(0,0,256,256);
  // Ripple lines
  for(let i=0;i<30;i++){
    ctx.strokeStyle='rgba(200,230,255,0.12)';
    ctx.lineWidth=0.8+Math.random();
    ctx.beginPath();
    ctx.moveTo(0,Math.random()*256);
    ctx.bezierCurveTo(64,Math.random()*256,192,Math.random()*256,256,Math.random()*256);
    ctx.stroke();
  }
});
waterTex.repeat.set(3, 3);

/* ═══════════════════════════════════════════════
   MATERIAL LIBRARY
═══════════════════════════════════════════════ */
function mat(color, rough=0.85, metal=0, tex=null, opts={}) {
  const m = new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    roughness: rough, metalness: metal,
    ...opts,
  });
  if (tex) { m.map = tex; m.color.set(0xffffff); }
  return m;
}

const M = {
  grass:    new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.92, metalness: 0 }),
  laterite: new THREE.MeshStandardMaterial({ map: lateriteTex, roughness: 0.95, metalness: 0 }),
  concrete: new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.72, metalness: 0.02 }),
  concreteLight: new THREE.MeshStandardMaterial({ color: 0xe6e2d8, roughness: 0.68, metalness: 0.02 }),
  glass:    new THREE.MeshStandardMaterial({ color: 0x8bbcd4, roughness: 0.05, metalness: 0.7, transparent: true, opacity: 0.55 }),
  glassDark:new THREE.MeshStandardMaterial({ color: 0x3a5870, roughness: 0.05, metalness: 0.8, transparent: true, opacity: 0.65 }),
  timber:   new THREE.MeshStandardMaterial({ map: timberTex, roughness: 0.75, metalness: 0 }),
  timberDark:new THREE.MeshStandardMaterial({ color: 0x3a2010, roughness: 0.88, metalness: 0 }),

/* ═══════════════════════════════════════════════
   GEOMETRY HELPERS
═══════════════════════════════════════════════ */
function box(w, h, d, m, rx=0, ry=0, rz=0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.rotation.set(rx, ry, rz);
  return mesh;
}
function cyl(rt, rb, h, m, seg=18) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
function plane(w, d, m) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m);
  mesh.receiveShadow = true;
  mesh.rotation.x = -Math.PI/2;
  return mesh;
}
function add(parent, child, x=0, y=0, z=0) {
  child.position.set(x, y, z);
  parent.add(child);
  return child;
}
function grp() { return new THREE.Group(); }

  // Slab F1→F2
  const s12 = box(11.5, 0.52, 11.8, M.cream);

  // Floor 2 — full-width timber louvre

  // Floor 2 — glazing behind louvres (warmly lit interior feel)
  const g2 = box(8.5, 3.5, 0.22, M.glass);

  const r2 = box(9.8, 1.0, 0.16, M.rail);

  // Flat roof slab — sharp edge, minimal overhang

    fo.castShadow = true;
    add(g, fo, x, 4.2, fz * -5.2);
  });

  g.traverse(child => { if(child.isMesh && child === base) {
    child.userData = { zone:'villa', lbl:'Residential', name: facingEast ? 'Premium Villa — East' : 'Premium Villa — West',
      desc:'3-bed polo-view villa · 330 sqm · Timber louvre screens · Glass balustrades · Undercroft parking' };
    clickables.push(child);
  }});

  parentGrp.add(g);
  return g;
}

/* ═══════════════════════════════════════════════

function buildTrees() {
  // Canopy LOD materials
  const cm = [
    new THREE.MeshStandardMaterial({ color:0x1a6018, roughness:0.94 }),
    new THREE.MeshStandardMaterial({ color:0x156214, roughness:0.94 }),
    new THREE.MeshStandardMaterial({ color:0x207022, roughness:0.94 }),
  ];

  function tree(x, z) {
    const g = grp();
    const h = 9 + Math.random()*7;
    const r = 3.0 + Math.random()*2.2;
    // Trunk — tapered
    const trunk = cyl(0.32, 0.45, h*0.48, M.trunkM, 7);
    add(g, trunk, 0, h*0.24, 0);
    // 3 canopy tiers
    [[0, r, h*0.6],[h*0.3, r*0.72, h*0.5],[h*0.52, r*0.48, h*0.42]].forEach(([yo, rc, hc]) => {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(rc, hc, 8), cm[Math.floor(Math.random()*3)]);
      cone.castShadow = true;
      add(g, cone, 0, h*0.48 + yo, 0);
    });
    g.position.set(x, 0, z);
    scene.add(g);
  }

  // South perimeter
  for(let x=-220;x<=220;x+=11) tree(x+(Math.random()-0.5)*4, 240+Math.random()*10);
  // North perimeter
  for(let x=-220;x<=220;x+=11) tree(x+(Math.random()-0.5)*4, -272+Math.random()*10);
  // West perimeter
  for(let z=-270;z<=240;z+=12) tree(-205+Math.random()*10, z+(Math.random()-0.5)*4);
  // East perimeter
  for(let z=-270;z<=240;z+=12) tree(198+Math.random()*10, z+(Math.random()-0.5)*4);

  // Palms flanking clubhouse (from render — tall, leaning slightly)
  function palm(x, z) {
    const g = grp();
    const h = 13 + Math.random()*4;
    const trunk = cyl(0.28, 0.38, h, new THREE.MeshStandardMaterial({ color:0x7a5022, roughness:0.92 }), 8);
    // Slight lean
    trunk.rotation.z = (Math.random()-0.5)*0.1;
    add(g, trunk, 0, h/2, 0);
    // Frond spray — 7 drooping planes
    const fm = new THREE.MeshStandardMaterial({ color:0x2a8020, roughness:0.9, side:THREE.DoubleSide });
    for(let i=0;i<7;i++) {
      const ang = (i/7)*Math.PI*2;
      const frond = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 4.8), fm);
      frond.castShadow = true;
      frond.position.set(Math.sin(ang)*2.2, h+0.5, Math.cos(ang)*2.2);
      frond.rotation.set(-0.6, ang, 0.2);
      g.add(frond);
    }
    g.position.set(x, 0, z);
    scene.add(g);
  }
  [-46,-34,34,46].forEach(x => palm(x, 172));
  [[-148,118],[-162,130],[-154,158],[-172,148]].forEach(([x,z]) => palm(x,z));

  // Tropical shrubs along paths — small spheres
  const shMat = new THREE.MeshStandardMaterial({ color:0x1a7012, roughness:0.94 });
  for(let i=0;i<60;i++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.7+Math.random()*0.8,7,5), shMat);
    s.castShadow = true; s.scale.y = 0.55;

    // Only place outside the field area

    s.position.set(x, 0.4, z);

/* ═══════════════════════════════════════════════
   RAYCASTER — click interaction
═══════════════════════════════════════════════ */
const clickables = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('click', e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickables, false);
  if(hits.length > 0) {
    const d = hits[0].object.userData;
    if(d.name) showInfo(d.lbl, d.name, d.desc);
  }
});

function showInfo(lbl, name, desc) {
  document.getElementById('zl').textContent = lbl;
  document.getElementById('zn').textContent = name;
  document.getElementById('zd').textContent = desc;
  const zi = document.getElementById('zi');
  zi.classList.add('on');
  clearTimeout(zi._t);
  zi._t = setTimeout(() => zi.classList.remove('on'), 5500);

/* ═══════════════════════════════════════════════
   CAMERA STATE
   ─────────────────────────────────────────────
   Two modes:
   1. VP mode  — click a viewpoint button, camera
      lerps to preset position
   2. Free walk — WASD/arrows move, mouse look,
      pointer lock for FPS feel
═══════════════════════════════════════════════ */

// World bounds — keep player inside estate
const BOUNDS = { xMin:-195, xMax:195, zMin:-270, zMax:215 };
const EYE_HEIGHT = 1.65;

let camPos    = new THREE.Vector3(0, EYE_HEIGHT, 0);
let targetPos = new THREE.Vector3(0, EYE_HEIGHT, 0);
let yaw   = Math.PI;  // looking south toward clubhouse
let pitch = 0;
const MAX_PITCH = Math.PI / 2.2;

// Movement state
const keys = {};
let isPointerDown = false;
let lastX = 0, lastY = 0;
let pointerLocked = false;
let freeWalk = false;          // true once user starts walking
let lastInteract = Date.now();

// Smooth velocity for walk feel
const velocity = new THREE.Vector3();
const WALK_SPEED  = 14;        // m/s
const SPRINT_SPEED= 28;        // m/s (hold Shift)
const DAMPING     = 0.82;      // per-frame velocity decay

/* ── Pointer lock ── */
const cvs = document.getElementById('c');

cvs.addEventListener('click', () => {
  if(!pointerLocked && freeWalk) {
    cvs.requestPointerLock?.();
    dismiss();
  }
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === cvs;
  document.getElementById('mode-badge').textContent =
    pointerLocked ? 'Free Walk · Esc to release' : 'Free Walk · Click to lock mouse';
});

document.addEventListener('mousemove', e => {
  if(pointerLocked) {
    yaw   -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch  = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, pitch));
    lastInteract = Date.now();
  }
});

/* ── Drag look (non-locked) ── */
cvs.addEventListener('mousedown', e => {
  if(pointerLocked) return;
  isPointerDown = true;
  lastX = e.clientX; lastY = e.clientY;
  dismiss();
});
window.addEventListener('mouseup', () => isPointerDown = false);
window.addEventListener('mousemove', e => {
  if(!isPointerDown || pointerLocked) return;
  yaw   -= (e.clientX - lastX) * 0.003;
  pitch -= (e.clientY - lastY) * 0.003;
  pitch  = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, pitch));
  lastX = e.clientX; lastY = e.clientY;
  lastInteract = Date.now();
});

/* ── Touch look (right-side drag) ── */
let touchLookId = null, tLookLX = 0, tLookLY = 0;
cvs.addEventListener('touchstart', e => {
  for(const t of e.changedTouches) {
    if(t.clientX > window.innerWidth * 0.45 && touchLookId === null) {
      touchLookId = t.identifier;
      tLookLX = t.clientX; tLookLY = t.clientY;
      dismiss();
    }
  }
}, {passive:true});
cvs.addEventListener('touchmove', e => {
  for(const t of e.changedTouches) {
    if(t.identifier === touchLookId) {
      yaw   -= (t.clientX - tLookLX) * 0.004;
      pitch -= (t.clientY - tLookLY) * 0.004;
      pitch  = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, pitch));
      tLookLX = t.clientX; tLookLY = t.clientY;
      lastInteract = Date.now();
    }
  }
}, {passive:true});
cvs.addEventListener('touchend', e => {
  for(const t of e.changedTouches) {
    if(t.identifier === touchLookId) touchLookId = null;
  }
}, {passive:true});

/* ── Gyroscope ── */
if(window.DeviceOrientationEvent) {
  let cal = null;
  window.addEventListener('deviceorientation', e => {
    if(!cal && e.gamma != null) cal = {b:e.beta, g:e.gamma};
    if(cal && e.gamma != null) {
      yaw   = -(e.gamma - cal.g) * 0.018 + Math.PI;
      pitch = -(e.beta  - cal.b) * 0.014;
      pitch  = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, pitch));
    }
  });
}

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'Escape') {
    if(pointerLocked) document.exitPointerLock?.();
    else window.location.href = 'index.html';
  }
  // Walking keys enable free walk mode
  if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) {
    if(!freeWalk) enableFreeWalk();
    lastInteract = Date.now();
  }
  dismiss();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function enableFreeWalk() {
  freeWalk = true;
  document.getElementById('mode-badge').classList.add('show');
  // Clear VP buttons
  document.querySelectorAll('.vpb').forEach(b => b.classList.remove('on'));
}

/* ── Touch joystick ── */
const joyEl    = document.getElementById('joy-move');
const joyKnob  = document.getElementById('joy-move-knob');
let joyId = null, joyBase = {x:0,y:0};
const joyInput = {x:0, y:0};

joyEl.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  joyId = t.identifier;
  const r = joyEl.getBoundingClientRect();
  joyBase = {x: r.left + r.width/2, y: r.top + r.height/2};
  if(!freeWalk) enableFreeWalk();
  e.preventDefault();
}, {passive:false});

joyEl.addEventListener('touchmove', e => {
  for(const t of e.changedTouches) {
    if(t.identifier !== joyId) continue;
    const dx = t.clientX - joyBase.x;
    const dy = t.clientY - joyBase.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const maxR = 28;
    const clamped = Math.min(dist, maxR);
    const nx = dist>0 ? dx/dist : 0;
    const ny = dist>0 ? dy/dist : 0;
    joyInput.x = nx * Math.min(1, dist/maxR);
    joyInput.y = ny * Math.min(1, dist/maxR);
    joyKnob.style.transform = `translate(calc(-50% + ${nx*clamped}px), calc(-50% + ${ny*clamped}px))`;
  }
  e.preventDefault();
}, {passive:false});

joyEl.addEventListener('touchend', e => {
  for(const t of e.changedTouches) {
    if(t.identifier === joyId) {
      joyId = null;
      joyInput.x = 0; joyInput.y = 0;
      joyKnob.style.transform = 'translate(-50%,-50%)';
    }
  }
}, {passive:false});

/* ── Viewpoints ── */
const VIEWPOINTS = [
  { pos:[0,   EYE_HEIGHT,  0],   yaw:Math.PI,   pitch:0,    label:'Centre Field' },
  { pos:[0,   3.5,       165],   yaw:Math.PI,   pitch:-0.1, label:'Clubhouse End' },
  { pos:[-76, EYE_HEIGHT,-40],   yaw:Math.PI/2, pitch:0,    label:'Pony Line' },
  { pos:[0,   EYE_HEIGHT,-155],  yaw:0,         pitch:0.05, label:'Lake End' },
  { pos:[-94, 2.5,         0],   yaw:Math.PI/2, pitch:0,    label:'Villa West' },
  { pos:[-150,EYE_HEIGHT, 118],  yaw:Math.PI/4, pitch:0,    label:'Stables Yard' },
];

let curVP = 0;

function setVP(idx) {

    { lbl:'Hospitality', name:'Clubhouse & Pavilion',       desc:'3-floor luxury clubhouse · 3,419 sqm · Tiered spectator stands overlooking the field' },
    { lbl:'Equestrian',  name:'Pony Line',                  desc:'The red laterite clay surround · 18m wide on all four sides · Where horses turn at the boundary' },
    { lbl:'Feature',     name:'Proposed Lake',              desc:'Ornamental crescent lake · Natural boundary between polo field and northern crescent villas' },
    { lbl:'Residential', name:'Premium Villas — West',      desc:'14 polo-view villas · 330 sqm each · Blonde timber louvres · Glass balustrades · Undercroft parking' },
    { lbl:'Equestrian',  name:'Horse Stables',              desc:'4 blocks · 56 stalls · Red laterite brick · Exposed timber trusses · Terracotta roof · Cobblestone yard' },
  ];
  showInfo(infos[idx].lbl, infos[idx].name, infos[idx].desc);
  dismiss();

function goVP(idx) { setVP(idx); }
window.goVP = goVP;

let hinted = false;
function dismiss() {
  if(hinted) return; hinted=true;
  document.getElementById('hint').classList.add('gone');
}

/* ═══════════════════════════════════════════════
   RADAR MINIMAP
   ─────────────────────────────────────────────
   Draws plan-2d.png scaled into the radar canvas,
   then overlays a gold directional arrow for the
   camera's current world position and yaw.

   World → radar mapping:
     World X: [-200, 200] → Radar X: [4, 156]
     World Z: [-270, 220] → Radar Y: [4, 100]
═══════════════════════════════════════════════ */
const radarCanvas = document.getElementById('radar-canvas');
const rctx = radarCanvas.getContext('2d');
const RC_W = 320, RC_H = 208;  // radar canvas resolution (2× for sharpness)

// World space bounds that fit the plan image
const WORLD_X_MIN = -200, WORLD_X_MAX = 200;
const WORLD_Z_MIN = -270, WORLD_Z_MAX = 220;

// Load the plan image for the radar
const radarImg = new Image();
radarImg.src = 'assets/plan-2d.png';
let radarImgLoaded = false;
radarImg.onload = () => { radarImgLoaded = true; };

function worldToRadar(wx, wz) {
  const rx = ((wx - WORLD_X_MIN) / (WORLD_X_MAX - WORLD_X_MIN)) * RC_W;
  const ry = ((wz - WORLD_Z_MIN) / (WORLD_Z_MAX - WORLD_Z_MIN)) * RC_H;
  return { x: rx, y: ry };
}

function drawRadar() {
  rctx.clearRect(0, 0, RC_W, RC_H);

  // Draw plan image (desaturated + darkened for subtlety)
  if(radarImgLoaded) {
    rctx.save();
    rctx.globalAlpha = 0.65;
    rctx.filter = 'saturate(0.4) brightness(0.6)';
    rctx.drawImage(radarImg, 0, 0, RC_W, RC_H);
    rctx.restore();
  } else {
    // Fallback: dark green rectangle
    rctx.fillStyle = 'rgba(20,45,20,0.8)';
    rctx.fillRect(0, 0, RC_W, RC_H);
  }

  // Subtle grid lines
  rctx.strokeStyle = 'rgba(201,168,76,0.08)';
  rctx.lineWidth = 0.5;
  for(let x=0; x<RC_W; x+=RC_W/6) {
    rctx.beginPath(); rctx.moveTo(x,0); rctx.lineTo(x,RC_H); rctx.stroke();
  }
  for(let y=0; y<RC_H; y+=RC_H/4) {
    rctx.beginPath(); rctx.moveTo(0,y); rctx.lineTo(RC_W,y); rctx.stroke();
  }

  // Camera position in radar space
  const rp = worldToRadar(camPos.x, camPos.z);

  // View cone — subtle gold wedge showing look direction
  const coneAngle = Math.PI / 5;  // 36° half-angle
  const coneLen   = 28;
  // yaw=0 is +Z in world; in radar +Z is downward, +X is rightward
  // radar yaw: 0 = down, π/2 = right → radar angle = yaw - π/2... 
  // world yaw=Math.PI means facing -Z (north on the plan which is up in world, down in radar)
  const radarAngle = yaw - Math.PI/2; // rotate by 90° for canvas space

  const x1 = rp.x + Math.cos(radarAngle - coneAngle) * coneLen;
  const y1 = rp.y + Math.sin(radarAngle - coneAngle) * coneLen;
  const x2 = rp.x + Math.cos(radarAngle + coneAngle) * coneLen;
  const y2 = rp.y + Math.sin(radarAngle + coneAngle) * coneLen;

  rctx.save();
  rctx.beginPath();
  rctx.moveTo(rp.x, rp.y);
  rctx.lineTo(x1, y1);
  rctx.lineTo(x2, y2);
  rctx.closePath();
  rctx.fillStyle = 'rgba(201,168,76,0.18)';
  rctx.fill();
  rctx.strokeStyle = 'rgba(201,168,76,0.4)';
  rctx.lineWidth = 0.8;
  rctx.stroke();
  rctx.restore();

  // Direction arrow — thin gold line from dot
  const arrowLen = 18;
  const ax = rp.x + Math.cos(radarAngle) * arrowLen;
  const ay = rp.y + Math.sin(radarAngle) * arrowLen;

  rctx.save();
  rctx.strokeStyle = '#C9A84C';
  rctx.lineWidth = 1.5;
  rctx.lineCap = 'round';
  rctx.beginPath();
  rctx.moveTo(rp.x, rp.y);
  rctx.lineTo(ax, ay);
  rctx.stroke();

  // Arrowhead
  const headLen = 5, headAngle = 0.45;
  rctx.beginPath();
  rctx.moveTo(ax, ay);
  rctx.lineTo(ax - headLen*Math.cos(radarAngle - headAngle), ay - headLen*Math.sin(radarAngle - headAngle));
  rctx.moveTo(ax, ay);
  rctx.lineTo(ax - headLen*Math.cos(radarAngle + headAngle), ay - headLen*Math.sin(radarAngle + headAngle));
  rctx.stroke();
  rctx.restore();

  // Position dot — gold filled circle
  rctx.save();
  // Outer ring (subtle halo)
  rctx.beginPath();
  rctx.arc(rp.x, rp.y, 5.5, 0, Math.PI*2);
  rctx.fillStyle = 'rgba(201,168,76,0.2)';
  rctx.fill();
  // Inner dot
  rctx.beginPath();
  rctx.arc(rp.x, rp.y, 3, 0, Math.PI*2);
  rctx.fillStyle = '#C9A84C';
  rctx.fill();
  rctx.restore();

  // Coordinates readout
  document.getElementById('radar-coords').textContent =
    `${Math.round(camPos.x)}m E  ·  ${Math.round(-camPos.z)}m N`;
}

/* ═══════════════════════════════════════════════
   RENDER LOOP — free walk + radar
═══════════════════════════════════════════════ */
const lookDir  = new THREE.Vector3();
const moveDir  = new THREE.Vector3();
const rightDir = new THREE.Vector3();
const UP       = new THREE.Vector3(0, 1, 0);
const clock    = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); // cap at 50ms

  /* ── Free walk movement ── */
  if(freeWalk) {
    // Forward direction (horizontal only — no flying)
    lookDir.set(Math.sin(yaw), 0, Math.cos(yaw)).normalize();
    rightDir.crossVectors(lookDir, UP).normalize();

    // Gather input
    const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
    const speed = sprint ? SPRINT_SPEED : WALK_SPEED;
    const accel = new THREE.Vector3();

    // Keyboard
    if(keys['KeyW'] || keys['ArrowUp'])   accel.addScaledVector(lookDir, -speed);
    if(keys['KeyS'] || keys['ArrowDown']) accel.addScaledVector(lookDir,  speed);
    if(keys['KeyA'])                      accel.addScaledVector(rightDir, -speed);
    if(keys['KeyD'])                      accel.addScaledVector(rightDir,  speed);

    // Touch joystick
    if(joyInput.x !== 0 || joyInput.y !== 0) {
      accel.addScaledVector(rightDir, joyInput.x * speed);
      accel.addScaledVector(lookDir,  joyInput.y * speed);  // y=+1 is forward in joystick
    }

    // Apply to velocity with damping
    velocity.addScaledVector(accel, dt);
    velocity.multiplyScalar(DAMPING);

    // Proposed new position
    const newX = THREE.MathUtils.clamp(camPos.x + velocity.x * dt, BOUNDS.xMin, BOUNDS.xMax);
    const newZ = THREE.MathUtils.clamp(camPos.z + velocity.z * dt, BOUNDS.zMin, BOUNDS.zMax);
    camPos.set(newX, EYE_HEIGHT, newZ);
    targetPos.copy(camPos);

  } else {
    // VP mode — smooth lerp to target
    camPos.lerp(targetPos, 0.055);
  }

  // Apply camera position
  camera.position.copy(camPos);

  // Camera orientation from yaw/pitch
  lookDir.set(
    Math.sin(yaw) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw) * Math.cos(pitch)
  );
  camera.lookAt(camPos.clone().add(lookDir));

  // Update radar every frame
  drawRadar();

  renderer.render(scene, camera);
}

/* ── Initial yaw ── */
{
  const vp = VIEWPOINTS[0];
  yaw   = vp.yaw;
  pitch = vp.pitch;
}

/* ═══════════════════════════════════════════════
   BUILD EVERYTHING
═══════════════════════════════════════════════ */
function build() {
  const progress = document.getElementById('lp');
  const steps = [
    [() => { buildClubhouse(); }, 20, 'Clubhouse'],
    [() => { buildVillas(); },    45, 'Villas'],
    [() => { buildApartments(); },60, 'Apartments'],
    [() => { buildStables(); },   72, 'Stables'],
    [() => { buildCrescent(); },  80, 'Crescent'],
    [() => { buildTraining(); },  86, 'Training field'],
    [() => { buildTrees(); },     98, 'Landscape'],
  ];

  let i = 0;
  function next() {
    if(i >= steps.length) {
      progress.style.width = '100%';
      setTimeout(() => {
        document.getElementById('loader').classList.add('out');
        document.getElementById('nav').classList.add('show');
        document.getElementById('vp').classList.add('show');
        document.getElementById('radar').classList.add('show');
        setTimeout(() => document.getElementById('loader').remove(), 1000);
        setVP(0);
        animate();
      }, 400);
      return;
    }
    const [fn, pct] = steps[i++];
    fn();
    progress.style.width = pct + '%';
    setTimeout(next, 60);
  }
  next();
}

build();
