<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Project XIX — Polo Field</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1C3A2A;--gold:#C9A84C;--cream:#F5F0E8}
body{background:#0a1008;overflow:hidden;font-family:'Inter',sans-serif}
#c{display:block;width:100vw;height:100vh}

/* Loader */
#loader{position:fixed;inset:0;z-index:200;background:#0a1008;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .9s ease}
#loader.out{opacity:0;pointer-events:none}
.lt{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;
  color:var(--cream);letter-spacing:.1em;margin-bottom:5px}
.lt span{color:var(--gold)}
.ls{font-size:9px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(245,240,232,.28);margin-bottom:52px}
.lb{width:140px;height:1px;background:rgba(255,255,255,.07);overflow:hidden}
.lp{height:100%;width:0%;background:var(--gold);transition:width .1s linear}

/* Nav */
#nav{position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;padding:0 20px;height:52px;
  background:rgba(6,14,6,.88);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(201,168,76,.12);
  opacity:0;transition:opacity .5s ease}
#nav.show{opacity:1}
.nbk{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(245,240,232,.5);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:5px;padding:5px 12px;cursor:pointer;text-decoration:none;transition:all .2s}
.nbk:hover{color:var(--cream);background:rgba(255,255,255,.1)}
.nbk svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round}
.ntitle{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:300;
  color:var(--cream);position:absolute;left:50%;transform:translateX(-50%)}
.nbadge{font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);border:1px solid rgba(201,168,76,.28);border-radius:3px;
  padding:3px 8px;margin-left:auto}

/* Crosshair */
#xhair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;z-index:50;opacity:.35}
#xhair::before,#xhair::after{content:'';position:absolute;background:var(--gold)}
#xhair::before{width:14px;height:1px;top:0;left:-7px}
#xhair::after{width:1px;height:14px;top:-7px;left:0}

/* Hint */
#hint{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:8px;
  background:rgba(6,14,6,.85);backdrop-filter:blur(10px);
  border:1px solid rgba(201,168,76,.16);border-radius:40px;
  padding:8px 18px;font-size:11px;color:rgba(245,240,232,.45);
  white-space:nowrap;pointer-events:none;transition:opacity .6s}
#hint.gone{opacity:0}

/* Zone info */
#zi{position:fixed;top:64px;right:16px;z-index:100;
  background:rgba(6,14,6,.92);backdrop-filter:blur(14px);
  border:1px solid rgba(201,168,76,.2);border-radius:10px;
  padding:14px 16px;max-width:215px;
  opacity:0;transition:opacity .35s;pointer-events:none}
#zi.on{opacity:1}
.zl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(201,168,76,.6);margin-bottom:4px}
.zn{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;
  color:var(--cream);margin-bottom:5px;line-height:1.2}
.zd{font-size:11px;color:rgba(245,240,232,.38);line-height:1.55}

/* Viewpoint strip */
#vp{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(6,14,6,.92);backdrop-filter:blur(18px);
  border-top:1px solid rgba(201,168,76,.13);
  padding:11px 18px 20px;
  opacity:0;transition:opacity .5s ease .5s}
#vp.show{opacity:1}
.vplbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,240,232,.22);margin-bottom:9px}
.vprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.vprow::-webkit-scrollbar{display:none}
.vpb{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 14px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);border-radius:7px;
  cursor:pointer;transition:all .2s;min-width:80px;color:rgba(245,240,232,.4)}
.vpb:hover{background:rgba(255,255,255,.08);border-color:rgba(201,168,76,.3)}
.vpb.on{background:rgba(201,168,76,.09);border-color:#C9A84C;color:#C9A84C}
.vpic{font-size:16px;line-height:1}
.vpb svg{width:22px;height:22px;stroke:rgba(245,240,232,.38);fill:none;
  stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.vpb.on svg{stroke:#C9A84C}
.vpnm{font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  text-align:center;line-height:1.35;color:rgba(245,240,232,.4);transition:color .2s}
.vpb.on .vpnm{color:#C9A84C}

/* ── Radar minimap ── */
#radar{
  position:fixed;bottom:96px;right:16px;z-index:100;
  width:160px;height:104px;border-radius:10px;overflow:hidden;
  border:1px solid rgba(201,168,76,.22);
  background:rgba(6,14,6,.82);backdrop-filter:blur(10px);
  opacity:0;transition:opacity .5s ease 1s;
}
#radar.show{opacity:1}
#radar-canvas{display:block;width:160px;height:104px}
#radar-lbl{
  position:absolute;top:5px;left:8px;
  font-size:8px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(201,168,76,.5);pointer-events:none;
}
#radar-coords{
  position:absolute;bottom:5px;left:8px;right:8px;
  font-size:7px;letter-spacing:.06em;
  color:rgba(245,240,232,.28);font-family:'Inter',monospace;
  pointer-events:none;
}

/* ── Movement mode badge ── */
#mode-badge{
  position:fixed;top:64px;left:50%;transform:translateX(-50%);
  z-index:100;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(201,168,76,.6);background:rgba(6,14,6,.82);
  border:1px solid rgba(201,168,76,.2);border-radius:20px;
  padding:5px 14px;opacity:0;transition:opacity .3s;pointer-events:none;
}
#mode-badge.show{opacity:1}

/* ── Touch joystick — mobile ── */
#joy-move{
  position:fixed;bottom:120px;left:24px;z-index:100;
  width:90px;height:90px;border-radius:50%;
  background:rgba(6,14,6,.45);border:1px solid rgba(201,168,76,.2);
  display:none;touch-action:none;
}
#joy-move-knob{
  position:absolute;width:34px;height:34px;border-radius:50%;
  background:rgba(201,168,76,.4);border:1px solid rgba(201,168,76,.6);
  top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;transition:background .15s;
}
@media(pointer:coarse){#joy-move{display:block}}
/* ── Time of day ── */
#todWrap{position:fixed;top:64px;right:16px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.tod-btns{display:flex;gap:5px}
.tod-btn{border:1px solid rgba(245,240,232,.28);background:rgba(10,16,12,.5);color:rgba(245,240,232,.8);border-radius:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:6px 11px;cursor:pointer;backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;transition:all .2s;font-family:'Inter',sans-serif}
.tod-btn:hover{border-color:#C9A84C;color:#F5F0E8}
.tod-btn.active{border-color:#C9A84C;color:#C9A84C;background:rgba(28,58,42,.6)}
.tod-btn svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#todSlider{-webkit-appearance:none;appearance:none;width:180px;height:3px;border-radius:2px;background:linear-gradient(90deg,#0c1a3a 0%,#e8a44c 25%,#bcd8f0 50%,#e8a44c 75%,#0c1a3a 100%);outline:none;cursor:pointer}
#todSlider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#C9A84C;border:2px solid #fff;cursor:pointer}
#todLabel{font-size:9px;letter-spacing:.14em;color:rgba(245,240,232,.6);font-family:'Inter',sans-serif}
@media (pointer:coarse){#todSlider{width:130px}}
</style>
</head>
<body>

</div>

<nav id="nav">
  <a class="nbk" href="index.html">
    <svg viewBox="0 0 16 16"><path d="M10 12L6 8l4-4"/></svg>
    Masterplan
  </a>

</nav>

<div id="todWrap">
  <div class="tod-btns">
    <button class="tod-btn" data-h="10.5"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.5 4.5l2 2M17.5 17.5l2 2M19.5 4.5l-2 2M6.5 17.5l-2 2"/></svg>Day</button>
    <button class="tod-btn active" data-h="16.2"><svg viewBox="0 0 24 24"><path d="M4 17h16M7 13a5 5 0 0 1 10 0M12 4v3M5 8l1.5 1.5M19 8l-1.5 1.5"/></svg>Golden</button>
    <button class="tod-btn" data-h="21.5"><svg viewBox="0 0 24 24"><path d="M20 13.5A8 8 0 1 1 10.5 4 6.5 6.5 0 0 0 20 13.5z"/></svg>Night</button>

<div id="xhair"></div>

<div id="vp">

    <!-- Centre Field -->

      </svg>

    <!-- Pony Line -->
    <button class="vpb" id="vb2" onclick="goVP(2)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="8" width="20" height="8" rx="1"/>
        <line x1="6" y1="8" x2="6" y2="16"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="18" y1="8" x2="18" y2="16"/>

      </svg>

    <!-- Lake End -->
    <button class="vpb" id="vb3" onclick="goVP(3)">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 16c1.5-2 3-2 4.5 0s3 2 4.5 0 3-2 4.5 0 3 2 4.5 0"/>
        <path d="M2 12c1.5-2 3-2 4.5 0s3 2 4.5 0 3-2 4.5 0 3 2 4.5 0"/>

    </button>

    <!-- Clubhouse — links to clubhouse.html -->
    <button class="vpb" onclick="window.location.href='clubhouse.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="9" width="18" height="9"/>
        <path d="M3 9l3-4h12l3 4"/>
        <line x1="9" y1="13" x2="15" y2="13"/>

    </button>

    <!-- Stables — links to stables.html -->
    <button class="vpb" id="vb5" onclick="window.location.href='stables.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 20V10l10-7 10 7v10"/>
        <path d="M2 14h20"/>
        <line x1="8" y1="14" x2="8" y2="20"/>
        <line x1="16" y1="14" x2="16" y2="20"/>
        <path d="M8 10c0-2.2 1.8-4 4-4s4 1.8 4 4"/>
      </svg>
      <div class="vpnm">Stables<br>↗</div>
    </button>

  </div>
</div>

<!-- Radar minimap -->
<div id="radar">
  <canvas id="radar-canvas" width="320" height="208"></canvas>
  <div id="radar-lbl">Site Map</div>
  <div id="radar-coords" id="radar-coords"></div>
</div>

<button id="debug-toggle-btn" onclick="toggleDebug()" style="position:fixed;bottom:16px;right:200px;z-index:20;background:rgba(10,16,12,.6);border:1px solid rgba(245,240,232,.28);color:rgba(245,240,232,.8);border-radius:6px;font-size:10px;letter-spacing:.1em;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px);font-family:Inter,sans-serif;">PLAN VIEW</button>

<!-- Movement mode badge -->

<!-- Touch joystick (mobile) -->

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* ═══════════════════════════════════════════════
   SCENE SETUP
═══════════════════════════════════════════════ */
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'),
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc8e8b8, 220, 480);

const camera = new THREE.PerspectiveCamera(68, W/H, 0.1, 600);
camera.position.set(0, 1.65, 0);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

/* ═══════════════════════════════════════════════
   SKY — procedural Preetham sky
   Lagos golden afternoon: sun low-ish south-west
═══════════════════════════════════════════════ */
const sky = new Sky();
sky.scale.setScalar(490);
scene.add(sky);
const sun = new THREE.Vector3();
const skyUni = sky.material.uniforms;
skyUni['turbidity'].value = 5.5;       // slight harmattan haze
skyUni['rayleigh'].value = 1.8;        // blue scattering
skyUni['mieCoefficient'].value = 0.04;
skyUni['mieDirectionalG'].value = 0.88;
// Sun position: elevation 28°, azimuth 225° (south-west)
const phi = THREE.MathUtils.degToRad(90 - 28);
const theta = THREE.MathUtils.degToRad(225);
sun.setFromSphericalCoords(1, phi, theta);
skyUni['sunPosition'].value.copy(sun);

/* ═══════════════════════════════════════════════
   LIGHTING — physically correct
═══════════════════════════════════════════════ */
// Ambient — sky blue fill
const ambient = new THREE.HemisphereLight(0xb8d8ff, 0x8b5a20, 0.55);
scene.add(ambient);

// Key sun — warm golden afternoon
const sunLight = new THREE.DirectionalLight(0xffe4a0, 2.8);
sunLight.position.set(-80, 120, 100);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 700;
sunLight.shadow.camera.left = -260;
sunLight.shadow.camera.right = 260;
sunLight.shadow.camera.top = 260;
sunLight.shadow.camera.bottom = -260;
sunLight.shadow.bias = -0.0003;
sunLight.shadow.normalBias = 0.02;
scene.add(sunLight);

// Fill — soft blue from opposite side
const fill = new THREE.DirectionalLight(0xc0d8ff, 0.55);
fill.position.set(60, 40, -60);
scene.add(fill);

/* ═══════════════════════════════════════════════
   DAY / NIGHT ENGINE
═══════════════════════════════════════════════ */
// Stars
const _starGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array(1000*3);
  for (let i=0;i<1000;i++){
    const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1)*0.5;
    pos[i*3]=230*Math.sin(p)*Math.cos(t); pos[i*3+1]=230*Math.cos(p)+20; pos[i*3+2]=230*Math.sin(p)*Math.sin(t);
  }
  _starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
}
const _starMat = new THREE.PointsMaterial({ color:0xdfe8ff, size:0.9, transparent:true, opacity:0, depthWrite:false });
scene.add(new THREE.Points(_starGeo, _starMat));

// Night window glow — emissive strips on building facades
const _glowMat = new THREE.MeshBasicMaterial({ color:0xffc878, transparent:true, opacity:0, depthWrite:false });
const _glows = [];
function _glow(w,h,x,y,z,ry=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), _glowMat);
  m.position.set(x,y,z); m.rotation.y = ry; scene.add(m); _glows.push(m);
}
_glow(6, 6, 84, 6.5, 0, -Math.PI/2);                  // clubhouse facade (south flank, rotated)
for (let i=0;i<14;i++){                               // villa rows (both sides, field-facing)
  const z = -78 + i*12;
  _glow(6, 2.2, -97.6, 3.2, z, Math.PI/2);   // north (lake-side) villas
  _glow(6, 2.2,  97.6, 3.2, z, -Math.PI/2);  // south (clubhouse-side) villas
}
_glow(16, 8, 118, 10, 55, -Math.PI/2);                // apartment block A
_glow(16, 8, 118, 10, -55, -Math.PI/2);               // apartment block B
_glow(26, 2.4, 165, 2.4, -190);                       // stables (southwest)
const _nightPts = [
  new THREE.PointLight(0xffd090, 0, 60, 1.6),
  new THREE.PointLight(0xffd090, 0, 50, 1.6),
  new THREE.PointLight(0xffc878, 0, 40, 1.8),
];
_nightPts[0].position.set(84, 8, 0); _nightPts[1].position.set(165, 5, -195); _nightPts[2].position.set(-94, 6, 0);
_nightPts.forEach(l=>scene.add(l));

const _fogDay = new THREE.Color(0xc8e8b8), _fogDusk = new THREE.Color(0xe0a870), _fogNight = new THREE.Color(0x0a1220);
let _hour = 16.2;
function setHour(h){
  _hour = h;
  const el = THREE.MathUtils.clamp(Math.sin((h-6)/12*Math.PI), -0.35, 1);
  const elevation = el * 62;
  const azimuth = 115 + ((h-6)/12)*130;
  sun.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90-elevation), THREE.MathUtils.degToRad(azimuth));
  skyUni['sunPosition'].value.copy(sun);
  sunLight.position.copy(sun).multiplyScalar(220);

  const day = THREE.MathUtils.smoothstep(el, 0.02, 0.28);
  const dusk = Math.max(0, 1 - Math.abs(el - .1)/.18);
  skyUni['turbidity'].value = 5.5 + dusk*6;
  skyUni['rayleigh'].value = 1.6 + dusk*1.8;
  skyUni['mieCoefficient'].value = .004 + dusk*.03;

  sunLight.intensity = 2.9 * day;
  sunLight.color.setHSL(.09 + .02*day, .55 - .3*day + dusk*.3, .55 + .1*day);
  ambient.intensity = .12 + .48*day;
  fill.intensity = .1 + .45*day;
  renderer.toneMappingExposure = .5 + .62*day + dusk*.15;
  _starMat.opacity = (1-day)*.9;

  scene.fog.color.copy(_fogNight).lerp(_fogDay, day).lerp(_fogDusk, dusk*.6);
  const glow = 1-day;
  _glowMat.opacity = glow*.85;
  _nightPts.forEach(l=> l.intensity = glow*220);

  const hh = Math.floor(h), mm = Math.round((h-hh)*60).toString().padStart(2,'0');
  const label = day>.7? 'Lagos '+(h<12?'Morning':'Afternoon') : day>.15? 'Golden Hour' : 'Lagos Night';
  document.getElementById('todLabel').textContent = `${hh}:${mm} · ${label}`;
  document.querySelectorAll('.tod-btn').forEach(b=>b.classList.toggle('active', Math.abs(+b.dataset.h - h) < .8));
}

  document.getElementById('todSlider').value = target;
  (function anim(){ const t = Math.min(1,(performance.now()-t0)/900); setHour(start + (target-start)*(t*t*(3-2*t))); if (t<1) requestAnimationFrame(anim); })();
}));

// Procedural canvas texture helper
function canvasTex(w, h, fn) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  fn(cv.getContext('2d'));
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function mat(color, rough=0.85, metal=0, tex=null, opts={}) {
  const m = new THREE.MeshStandardMaterial({

═══════════════════════════════════════════════ */
function box(w, h, d, m, rx=0, ry=0, rz=0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.rotation.set(rx, ry, rz);
  return mesh;
}
function cyl(rt, rb, h, m, seg=18) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
function plane(w, d, m) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m);
  mesh.receiveShadow = true;
  mesh.rotation.x = -Math.PI/2;
  return mesh;
}
function add(parent, child, x=0, y=0, z=0) {
  child.position.set(x, y, z);
  parent.add(child);
  return child;
}
function grp() { return new THREE.Group(); }

      name: isCorner ? 'Premium Villa — Corner Wrap' : (facingEast ? 'Premium Villa — South (Clubhouse side)' : 'Premium Villa — North (Lake side)'),
      desc:'3-bed polo-view villa · 330 sqm · Timber louvre screens · Glass balustrades · Undercroft parking' };
    clickables.push(child);
  }});

  parentGrp.add(g);
  return g;
}

function buildVillas() {
  // North row (x=-102) — lake-side flank · South row (x=+102) — clubhouse-side flank
  const nG = grp(); nG.position.set(-102, 0, 0); scene.add(nG);
  const sG = grp(); sG.position.set( 102, 0, 0); scene.add(sG);
  for(let i=0;i<14;i++) {
    makeVilla(nG, 0, -78 + i*12, false);
    makeVilla(sG, 0, -78 + i*12, true);
  }

  // ── Villa ring corners — west and east ends wrap the villas around
  //    the field's short ends, connecting the north and south rows
  //    into a continuous horseshoe instead of two disconnected rows.
  //    Semicircle, radius 102 (matching the row offset), centred on
  //    each row-end so it meets both rows tangentially.
  const wG = grp(); scene.add(wG);
  const eG = grp(); scene.add(eG);
  const CORNER_N = 7, R = 102;
  for (let i=0;i<=CORNER_N;i++){
    const t = i / CORNER_N;
    // West corner: centre (0,-78), sweep π→2π (through -Z, the west tip)
    {
      const theta = Math.PI + t*Math.PI;
      const x = R*Math.cos(theta), z = -78 + R*Math.sin(theta);
      const rotY = -theta + Math.PI/2;   // face radially inward, toward the field
      makeVilla(wG, x, z, false, rotY, true);
    }
    // East corner: centre (0,78), sweep π→0 (through +Z, the east tip)
    {
      const theta = Math.PI - t*Math.PI;
      const x = R*Math.cos(theta), z = 78 + R*Math.sin(theta);
      const rotY = -theta + Math.PI/2;
      makeVilla(eG, x, z, true, rotY, true);
    }
  }
}

/* ═══════════════════════════════════════════════
   ROAD NETWORK
   Reproduced before/alongside buildings rather than treated as an
   afterthought — the curved ring road follows the exact same arc
   geometry as the villa horseshoe (offset 16m outward), Proposed
   Lagos Road runs the full southern boundary, and a north perimeter
   road serves the lake/loft precinct.
═══════════════════════════════════════════════ */
function roadRibbon(pts, width, mat, yPos=0.06) {
  const n = pts.length;
  const left = [], right = [];
  for (let i=0;i<n;i++){
    const p = pts[i], prev = pts[Math.max(0,i-1)], next = pts[Math.min(n-1,i+1)];
    const dx = next.x-prev.x, dz = next.z-prev.z;
    const len = Math.hypot(dx,dz) || 1;
    const nx = -dz/len, nz = dx/len;
    left.push({ x: p.x + nx*width/2, z: p.z + nz*width/2 });
    right.push({ x: p.x - nx*width/2, z: p.z - nz*width/2 });
  }
  const positions = [], uvs = [];
  for (let i=0;i<n;i++){
    positions.push(left[i].x, yPos, left[i].z, right[i].x, yPos, right[i].z);
    uvs.push(0, i/4, 1, i/4);
  }
  const indices = [];
  for (let i=0;i<n-1;i++){ const a=i*2,b=i*2+1,c=i*2+2,d=i*2+3; indices.push(a,b,c, b,d,c); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  return mesh;
}

function buildRoads() {
  const asphaltTex = canvasTex(128, 128, ctx => {
    ctx.fillStyle = '#3a3a3c'; ctx.fillRect(0,0,128,128);

  });
  asphaltTex.repeat.set(3,3);
  const roadMat = new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.9 });
  const markingMat = new THREE.MeshStandardMaterial({ color: 0xf0d040, roughness: 0.5, transparent:true, opacity:0.85 });
  const roads = grp(); scene.add(roads);

  // ── Internal ring road — stadium shape, 16m outside the villa horseshoe ──
  {
    const R = 118, pts = [];
    // north straight (west row side)
    pts.push({x:-118, z:-78}, {x:-118, z:78});
    // east corner arc, centre (0,78), R=118, sweep π→0
    for (let i=0;i<=20;i++){ const t=i/20, th=Math.PI-t*Math.PI; pts.push({x:118*Math.cos(th), z:78+118*Math.sin(th)}); }
    pts.push({x:118, z:-78});
    // west corner arc, centre (0,-78), R=118, sweep 0→-π
    for (let i=0;i<=20;i++){ const t=i/20, th=-t*Math.PI; pts.push({x:118*Math.cos(th), z:-78+118*Math.sin(th)}); }
    const ring = roadRibbon(pts, 8, roadMat);
    add(roads, ring, 0, 0, 0);
    // dashed centreline
    for (let i=0;i<pts.length-1;i+=2){
      const p = pts[i]; const dm = plane(1.2, 0.25, markingMat);
      const next = pts[Math.min(i+1,pts.length-1)];
      dm.rotation.z = Math.atan2(next.x-p.x, next.z-p.z);
      add(roads, dm, p.x, 0.09, p.z);
    }
  }

  // ── Proposed Lagos Road — major southern arterial boundary ──
  {
    const pts = [{x:150, z:-260}, {x:150, z:260}];
    const road = roadRibbon(pts, 16, roadMat);
    add(roads, road, 0,0,0);
    // Lane markings — dashed centre line + solid edge lines
    for (let z=-255; z<255; z+=14){
      const dm = plane(0.35, 8, markingMat); add(roads, dm, 150, 0.09, z+4);
    }
    const edgeMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.5, transparent:true, opacity:0.7 });
    [142,158].forEach(x => { const el = plane(0.25, 520, edgeMat); add(roads, el, x, 0.08, 0); });
    const lbl = { zone:'road', lbl:'Infrastructure', name:'Proposed Lagos Road', desc:'Major southern arterial boundary · Multi-lane · Estate entrance connection' };
  }

  // ── North perimeter road — serves the lake / loft-apartment precinct ──
  {
    const pts = [{x:-158, z:-140}, {x:-158, z:140}];
    const road = roadRibbon(pts, 9, roadMat);
    add(roads, road, 0,0,0);
    for (let z=-135; z<135; z+=12){ const dm = plane(0.3, 6, markingMat); add(roads, dm, -158, 0.09, z+3); }
  }

  // ── Clubhouse forecourt spur — connects Lagos Road to the clubhouse drop-off ──
  {
    const pts = [{x:150, z:0}, {x:100, z:0}];
    add(roads, roadRibbon(pts, 7, roadMat), 0,0,0);
  }
}

function buildTrees() {
  /* ── Realistic royal palms — textured ringed trunks, drooping alpha fronds, wind sway ── */
  const R = (a,b)=>a+Math.random()*(b-a);

  const trunkTx = canvasTex(128, 512, g => {
    g.fillStyle='#8a7454'; g.fillRect(0,0,128,512);
    for(let y=0;y<512;y+=16){
      g.fillStyle=`rgba(${R(70,100)|0},${R(55,80)|0},${R(35,55)|0},.8)`; g.fillRect(0,y,128,R(5,9));
      g.fillStyle='rgba(30,22,12,.35)'; g.fillRect(0,y+9,128,2);
    }
    for(let i=0;i<600;i++){ g.fillStyle=`rgba(40,30,18,${R(.1,.3)})`; g.fillRect(R(0,128),R(0,512),2,3); }
  });
  trunkTx.repeat.set(1,3);

  const frondCv = document.createElement('canvas'); frondCv.width=512; frondCv.height=128;
  { const g = frondCv.getContext('2d');
    g.clearRect(0,0,512,128);
    g.strokeStyle='#5a5030'; g.lineWidth=5; g.beginPath(); g.moveTo(0,64); g.quadraticCurveTo(300,58,512,72); g.stroke();
    for(let i=0;i<70;i++){
      const t=i/70, x=20+t*480, cy=64+(t*t*8);
      const len=(1-Math.abs(t-0.45))*54+8;
      const hue = R(0,1)<.15? `rgb(${R(120,160)|0},${R(130,150)|0},60)` : `rgb(${R(40,80)|0},${R(105,150)|0},${R(35,60)|0})`;
      g.strokeStyle=hue; g.lineWidth=R(2.4,4);
      g.beginPath(); g.moveTo(x,cy); g.quadraticCurveTo(x+14,cy-len*.6,x+R(4,20),cy-len); g.stroke();
      g.beginPath(); g.moveTo(x,cy); g.quadraticCurveTo(x+14,cy+len*.6,x+R(4,20),cy+len); g.stroke();
    }
  }
  const frondTx = new THREE.CanvasTexture(frondCv);
  frondTx.colorSpace = THREE.SRGBColorSpace; frondTx.anisotropy = 8;

  const trunkMat = new THREE.MeshStandardMaterial({ map:trunkTx, roughness:.95 });
  const frondMat = new THREE.MeshStandardMaterial({ map:frondTx, transparent:true, alphaTest:.4, side:THREE.DoubleSide, roughness:.9 });

  // Pre-build a few frond geometry variants (bent planes) shared across all palms
  const frondGeos = [];
  for (let v=0; v<3; v++){
    const geo = new THREE.PlaneGeometry(4.2, 1.05, 8, 1);
    const p = geo.attributes.position;
    const droop = 1.3 + v*0.35;
    for (let k=0;k<p.count;k++){ const px=p.getX(k); const t=(px+2.1)/4.2; p.setY(k, p.getY(k) - t*t*droop); }
    geo.computeVertexNormals();
    frondGeos.push(geo);
  }

  function palm(x, z, s) {
    s = s || R(0.85, 1.25);
    const g = grp();
    const h = R(8, 13) * s;
    const lean = R(-.14,.14), leanZ = R(-.1,.1);
    const pts = [];
    for (let i=0;i<=8;i++){ const t=i/8; pts.push(new THREE.Vector3(Math.sin(lean)*t*t*h*.5, t*h, Math.sin(leanZ)*t*t*h*.4)); }
    const trunk = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 10, .22*s, 6), trunkMat);
    trunk.castShadow = true; g.add(trunk);
    const crown = grp(); crown.position.copy(pts[8]); g.add(crown);
    const n = 10;
    for (let i=0;i<n;i++){
      const f = new THREE.Mesh(frondGeos[(Math.random()*3)|0], frondMat);
      f.castShadow = true;
      const hold = grp();
      hold.rotation.y = (i/n)*Math.PI*2 + R(-.15,.15);
      hold.rotation.z = R(-.32,-.05);
      f.position.x = 2.0; f.scale.setScalar(s);
      hold.add(f); crown.add(hold);
    }
    for (let i=0;i<4;i++){
      const c = new THREE.Mesh(new THREE.SphereGeometry(.15*s, 7, 5), trunkMat);
      c.position.set(R(-.3,.3), -.15, R(-.3,.3)); crown.add(c);
    }
    g.position.set(x, 0, z);
    scene.add(g);
    palmCrowns.push({ crown, phase: R(0, 6.28) });
  }

  // Perimeter palm lines (all perimeter trees are palms — Lagos estate)

    const dx = t.clientX - joyBase.x;
    const dy = t.clientY - joyBase.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const maxR = 28;
    const clamped = Math.min(dist, maxR);
    const nx = dist>0 ? dx/dist : 0;
    const ny = dist>0 ? dy/dist : 0;
    joyInput.x = nx * Math.min(1, dist/maxR);
    joyInput.y = ny * Math.min(1, dist/maxR);
    joyKnob.style.transform = `translate(calc(-50% + ${nx*clamped}px), calc(-50% + ${ny*clamped}px))`;
  }
  e.preventDefault();
}, {passive:false});

  for(const t of e.changedTouches) {
    if(t.identifier === joyId) {

/* ═══════════════════════════════════════════════
   RADAR MINIMAP
   ─────────────────────────────────────────────
   Draws plan-2d.png scaled into the radar canvas,
   then overlays a gold directional arrow for the
   camera's current world position and yaw.

   World → radar mapping:
     World X: [-200, 200] → Radar X: [4, 156]
     World Z: [-270, 220] → Radar Y: [4, 100]
═══════════════════════════════════════════════ */
const radarCanvas = document.getElementById('radar-canvas');
const rctx = radarCanvas.getContext('2d');
const RC_W = 320, RC_H = 208;  // radar canvas resolution (2× for sharpness)

// World space bounds that fit the plan image
const WORLD_X_MIN = -200, WORLD_X_MAX = 200;
const WORLD_Z_MIN = -270, WORLD_Z_MAX = 220;

// Load the plan image for the radar
const radarImg = new Image();
radarImg.src = 'assets/plan-2d.png';
let radarImgLoaded = false;
radarImg.onload = () => { radarImgLoaded = true; };

function worldToRadar(wx, wz) {
  // Real plan-2d.png is landscape with the field's LENGTH (world Z, E-W) running
  // horizontally and WIDTH (world X, N-S) running vertically — map accordingly.
  const rx = ((wz - WORLD_Z_MIN) / (WORLD_Z_MAX - WORLD_Z_MIN)) * RC_W;
  const ry = ((wx - WORLD_X_MIN) / (WORLD_X_MAX - WORLD_X_MIN)) * RC_H;
  return { x: rx, y: ry };
}

function drawRadar() {
  rctx.clearRect(0, 0, RC_W, RC_H);

  // Draw plan image (desaturated + darkened for subtlety)
  if(radarImgLoaded) {
    rctx.save();
    rctx.globalAlpha = 0.65;
    rctx.filter = 'saturate(0.4) brightness(0.6)';
    rctx.drawImage(radarImg, 0, 0, RC_W, RC_H);
    rctx.restore();
  } else {
    // Fallback: dark green rectangle
    rctx.fillStyle = 'rgba(20,45,20,0.8)';
    rctx.fillRect(0, 0, RC_W, RC_H);
  }

  // Subtle grid lines
  rctx.strokeStyle = 'rgba(201,168,76,0.08)';
  rctx.lineWidth = 0.5;
  for(let x=0; x<RC_W; x+=RC_W/6) {
    rctx.beginPath(); rctx.moveTo(x,0); rctx.lineTo(x,RC_H); rctx.stroke();
  }
  for(let y=0; y<RC_H; y+=RC_H/4) {
    rctx.beginPath(); rctx.moveTo(0,y); rctx.lineTo(RC_W,y); rctx.stroke();
  }

  // Camera position in radar space
  const rp = worldToRadar(camPos.x, camPos.z);

  // View cone — subtle gold wedge showing look direction
  const coneAngle = Math.PI / 5;  // 36° half-angle
  const coneLen   = 28;
  // yaw=0 is +Z in world; in radar +Z is downward, +X is rightward
  // radar yaw: 0 = down, π/2 = right → radar angle = yaw - π/2... 
  // world yaw=Math.PI means facing -Z (north on the plan which is up in world, down in radar)
  // radar x = world Z, radar y = world X (see worldToRadar) → cone angle = yaw directly
  const radarAngle = yaw;

  const x1 = rp.x + Math.cos(radarAngle - coneAngle) * coneLen;
  const y1 = rp.y + Math.sin(radarAngle - coneAngle) * coneLen;
  const x2 = rp.x + Math.cos(radarAngle + coneAngle) * coneLen;
  const y2 = rp.y + Math.sin(radarAngle + coneAngle) * coneLen;

  rctx.save();
  rctx.beginPath();
  rctx.moveTo(rp.x, rp.y);
  rctx.lineTo(x1, y1);
  rctx.lineTo(x2, y2);
  rctx.closePath();
  rctx.fillStyle = 'rgba(201,168,76,0.18)';
  rctx.fill();
  rctx.strokeStyle = 'rgba(201,168,76,0.4)';
  rctx.lineWidth = 0.8;
  rctx.stroke();
  rctx.restore();

  // Direction arrow — thin gold line from dot
  const arrowLen = 18;
  const ax = rp.x + Math.cos(radarAngle) * arrowLen;
  const ay = rp.y + Math.sin(radarAngle) * arrowLen;

  rctx.save();
  rctx.strokeStyle = '#C9A84C';
  rctx.lineWidth = 1.5;
  rctx.lineCap = 'round';
  rctx.beginPath();
  rctx.moveTo(rp.x, rp.y);
  rctx.lineTo(ax, ay);
  rctx.stroke();

  // Arrowhead
  const headLen = 5, headAngle = 0.45;
  rctx.beginPath();
  rctx.moveTo(ax, ay);
  rctx.lineTo(ax - headLen*Math.cos(radarAngle - headAngle), ay - headLen*Math.sin(radarAngle - headAngle));
  rctx.moveTo(ax, ay);
  rctx.lineTo(ax - headLen*Math.cos(radarAngle + headAngle), ay - headLen*Math.sin(radarAngle + headAngle));
  rctx.stroke();
  rctx.restore();

  // Position dot — gold filled circle
  rctx.save();
  // Outer ring (subtle halo)
  rctx.beginPath();
  rctx.arc(rp.x, rp.y, 5.5, 0, Math.PI*2);
  rctx.fillStyle = 'rgba(201,168,76,0.2)';
  rctx.fill();
  // Inner dot
  rctx.beginPath();
  rctx.arc(rp.x, rp.y, 3, 0, Math.PI*2);
  rctx.fillStyle = '#C9A84C';
  rctx.fill();
  rctx.restore();

  // Coordinates readout
  document.getElementById('radar-coords').textContent =
    `${Math.round(camPos.x)}m E  ·  ${Math.round(-camPos.z)}m N`;
}

  if (e.key === ']') { overlayRotSteps++; planOverlay.rotation.z = Math.PI/2 + overlayRotSteps * Math.PI/2; }
  if (e.key === 'ArrowLeft')  planOverlay.position.x -= 2;
  if (e.key === 'ArrowRight') planOverlay.position.x += 2;
  if (e.key === 'ArrowUp')    planOverlay.position.z -= 2;
  if (e.key === 'ArrowDown')  planOverlay.position.z += 2;
  if (e.key === 'h' || e.key === 'H') planOverlay.visible = !planOverlay.visible;
});
// On-screen HUD (mobile-friendly)
{
  const hud = document.createElement('div');
  hud.id = 'debug-hud';
  hud.style.cssText = 'display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:40;background:rgba(10,16,12,.85);border:1px solid #C9A84C;border-radius:8px;padding:10px 16px;color:#F5F0E8;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.05em;gap:14px;align-items:center;';
  hud.innerHTML = `<b style="color:#C9A84C">MASTERPLAN DEBUG</b>
    <span>[ / ] rotate overlay · arrows nudge · H hide plan</span>
    <button id="debug-exit" style="background:none;border:1px solid #F5F0E8;color:#F5F0E8;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:10px;">Exit (M)</button>`;
  document.body.appendChild(hud);
  document.getElementById('debug-exit').onclick = toggleDebug;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); // cap at 50ms

  /* ── Seamless portals — walk close enough to a building and the
     estate "continues" into its dedicated scene, spawning you right
     at the threshold instead of dumping you on a menu viewpoint ── */
  if (freeWalk && !portalFired) {
    const px = camera.position.x, pz = camera.position.z;
    if (px > 78 && px < 106 && Math.abs(pz) < 45) {          // clubhouse threshold (south flank)
      firePortal('clubhouse.html?entry=field');
    } else if (px > 150 && px < 200 && pz < -160 && pz > -215) { // stables threshold (southwest)
      firePortal('stables.html?entry=field');
    }
  }

  /* ── Palm wind sway ── */
  const _t = clock.elapsedTime;
  for (const p of palmCrowns){
    p.crown.rotation.z = Math.sin(_t*.7 + p.phase)*.03;
    p.crown.rotation.x = Math.cos(_t*.55 + p.phase)*.025;
  }

  /* ── Free walk movement ── */
  if(freeWalk) {
    // Forward direction (horizontal only — no flying)
    lookDir.set(Math.sin(yaw), 0, Math.cos(yaw)).normalize();
    rightDir.crossVectors(lookDir, UP).normalize();

    // Gather input
    const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
    const speed = sprint ? SPRINT_SPEED : WALK_SPEED;
    const accel = new THREE.Vector3();

    // Keyboard
    if(keys['KeyW'] || keys['ArrowUp'])   accel.addScaledVector(lookDir, -speed);
    if(keys['KeyS'] || keys['ArrowDown']) accel.addScaledVector(lookDir,  speed);
    if(keys['KeyA'])                      accel.addScaledVector(rightDir, -speed);
    if(keys['KeyD'])                      accel.addScaledVector(rightDir,  speed);

    // Touch joystick
    if(joyInput.x !== 0 || joyInput.y !== 0) {
      accel.addScaledVector(rightDir, joyInput.x * speed);
      accel.addScaledVector(lookDir,  joyInput.y * speed);  // y=+1 is forward in joystick
    }

    // Apply to velocity with damping
    velocity.addScaledVector(accel, dt);
    velocity.multiplyScalar(DAMPING);

    // Proposed new position
    const newX = THREE.MathUtils.clamp(camPos.x + velocity.x * dt, BOUNDS.xMin, BOUNDS.xMax);
    const newZ = THREE.MathUtils.clamp(camPos.z + velocity.z * dt, BOUNDS.zMin, BOUNDS.zMax);
    camPos.set(newX, EYE_HEIGHT, newZ);
    targetPos.copy(camPos);

  } else {
    // VP mode — smooth lerp to target
    camPos.lerp(targetPos, 0.055);
  }

  // Apply camera position
  camera.position.copy(camPos);

  // Camera orientation from yaw/pitch
  lookDir.set(
    Math.sin(yaw) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw) * Math.cos(pitch)
  );
  camera.lookAt(camPos.clone().add(lookDir));

  // Update radar every frame
  drawRadar();

  renderer.render(scene, debugMode ? debugCam : camera);
}

/* ── Initial yaw ── */
{
  const vp = VIEWPOINTS[0];
  yaw   = vp.yaw;
  pitch = vp.pitch;
}

/* ═══════════════════════════════════════════════
   BUILD EVERYTHING
═══════════════════════════════════════════════ */
function build() {
  const progress = document.getElementById('lp');
  const steps = [
    [() => { buildRoads(); },     8,  'Roads'],
    [() => { buildClubhouse(); }, 20, 'Clubhouse'],
    [() => { buildVillas(); },    45, 'Villas'],
    [() => { buildApartments(); },60, 'Apartments'],
    [() => { buildStables(); },   72, 'Stables'],
    [() => { buildCrescent(); },  80, 'Crescent'],
    [() => { buildTraining(); },  86, 'Training field'],
    [() => { buildEastEnd(); },   92, 'East precinct'],
    [() => { buildTrees(); },     98, 'Landscape'],
  ];

  let i = 0;
  function next() {
    if(i >= steps.length) {
      progress.style.width = '100%';
      setTimeout(() => {
        document.getElementById('loader').classList.add('out');
        document.getElementById('nav').classList.add('show');
        document.getElementById('vp').classList.add('show');
        document.getElementById('radar').classList.add('show');
        setTimeout(() => document.getElementById('loader').remove(), 1000);
        setVP(0);
        animate();
      }, 400);
      return;
    }
    const [fn, pct] = steps[i++];
    fn();
    progress.style.width = pct + '%';
    setTimeout(next, 60);
  }
  next();
}

build();
</script>
