<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Project XIX — Horse Stables</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1C3A2A;--gold:#C9A84C;--cream:#F5F0E8;--rust:#c84820}
body{background:#0a0805;overflow:hidden;font-family:'Inter',sans-serif}
#c{display:block;width:100vw;height:100vh}

/* ── Loader ── */
#loader{position:fixed;inset:0;z-index:200;background:#0a0805;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .9s ease}
#loader.out{opacity:0;pointer-events:none}
.lt{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;
  color:var(--cream);letter-spacing:.1em;margin-bottom:5px}
.lt span{color:var(--gold)}
.ls{font-size:9px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(245,240,232,.28);margin-bottom:52px}
.lb{width:140px;height:1px;background:rgba(255,255,255,.07);overflow:hidden}
.lp{height:100%;width:0%;background:var(--gold);transition:width .15s linear}

/* ── Nav ── */
#nav{position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;padding:0 20px;height:52px;
  background:rgba(8,5,3,.9);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(201,168,76,.14);
  opacity:0;transition:opacity .5s ease}
#nav.show{opacity:1}
.nbk{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(245,240,232,.5);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:5px;padding:5px 12px;cursor:pointer;text-decoration:none;transition:all .2s}
.nbk:hover{color:var(--cream);background:rgba(255,255,255,.1)}
.ntitle{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:300;
  color:var(--cream);position:absolute;left:50%;transform:translateX(-50%)}
.nbadge{font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);border:1px solid rgba(201,168,76,.28);border-radius:3px;
  padding:3px 8px;margin-left:auto}

/* ── Hint ── */
#hint{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:9px;
  background:rgba(8,5,3,.88);backdrop-filter:blur(10px);
  border:1px solid rgba(201,168,76,.16);border-radius:40px;
  padding:8px 18px;font-size:11px;color:rgba(245,240,232,.45);
  white-space:nowrap;pointer-events:none;transition:opacity .6s}
#hint.gone{opacity:0}

/* ── Zone info ── */
#zi{position:fixed;top:64px;right:16px;z-index:100;
  background:rgba(8,5,3,.94);backdrop-filter:blur(14px);
  border:1px solid rgba(201,168,76,.2);border-radius:10px;
  padding:14px 16px;max-width:215px;
  opacity:0;transition:opacity .35s;pointer-events:none}
#zi.on{opacity:1}
.zl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(201,168,76,.6);margin-bottom:4px}
.zn{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;
  color:var(--cream);margin-bottom:5px;line-height:1.2}
.zd{font-size:11px;color:rgba(245,240,232,.38);line-height:1.55}

/* ── Viewpoint strip with line-art icons ── */
#vp{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(8,5,3,.94);backdrop-filter:blur(18px);
  border-top:1px solid rgba(201,168,76,.13);
  padding:11px 18px 20px;
  opacity:0;transition:opacity .5s ease .5s}
#vp.show{opacity:1}
.vplbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,240,232,.22);margin-bottom:9px}
.vprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.vprow::-webkit-scrollbar{display:none}
.vpb{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:9px 14px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);border-radius:7px;
  cursor:pointer;transition:all .2s;min-width:82px}
.vpb:hover{background:rgba(255,255,255,.08);border-color:rgba(201,168,76,.3)}
.vpb.on{background:rgba(201,168,76,.09);border-color:#C9A84C}
.vpb svg{width:22px;height:22px;stroke:rgba(245,240,232,.4);fill:none;
  stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.vpb.on svg{stroke:#C9A84C}
.vpnm{font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  text-align:center;line-height:1.35;color:rgba(245,240,232,.4);transition:color .2s}
.vpb.on .vpnm{color:#C9A84C}

/* ── Floor plan mini-map ── */
#floorplan{position:fixed;bottom:92px;left:16px;z-index:100;
  background:rgba(8,5,3,.92);backdrop-filter:blur(12px);
  border:1px solid rgba(201,168,76,.18);border-radius:8px;
  padding:10px;opacity:0;transition:opacity .5s ease .8s}
#floorplan.show{opacity:1}
#fplbl{font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(201,168,76,.5);margin-bottom:7px;text-align:center}
#fpsvg{display:block}
.fp-stall{fill:rgba(200,72,32,.12);stroke:rgba(200,72,32,.4);stroke-width:0.8;
  cursor:pointer;transition:fill .15s}
.fp-stall:hover,.fp-stall.active{fill:rgba(201,168,76,.3);stroke:rgba(201,168,76,.8)}
.fp-wall{stroke:rgba(245,240,232,.35);stroke-width:1.2;fill:none}
.fp-aisle{fill:rgba(139,88,48,.15)}
.fp-cam{fill:var(--gold);stroke:none}
/* ── Time of day ── */
#todWrap{position:fixed;top:64px;right:16px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.tod-btns{display:flex;gap:5px}
.tod-btn{border:1px solid rgba(245,240,232,.28);background:rgba(10,16,12,.5);color:rgba(245,240,232,.8);border-radius:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:6px 11px;cursor:pointer;backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;transition:all .2s;font-family:'Inter',sans-serif}
.tod-btn:hover{border-color:#C9A84C;color:#F5F0E8}
.tod-btn.active{border-color:#C9A84C;color:#C9A84C;background:rgba(28,58,42,.6)}
.tod-btn svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#todSlider{-webkit-appearance:none;appearance:none;width:180px;height:3px;border-radius:2px;background:linear-gradient(90deg,#0c1a3a 0%,#e8a44c 25%,#bcd8f0 50%,#e8a44c 75%,#0c1a3a 100%);outline:none;cursor:pointer}
#todSlider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#C9A84C;border:2px solid #fff;cursor:pointer}
#todLabel{font-size:9px;letter-spacing:.14em;color:rgba(245,240,232,.6);font-family:'Inter',sans-serif}
@media (pointer:coarse){#todSlider{width:130px}}
</style>
</head>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';

/* ═══════════════════════════════
   RENDERER
═══════════════════════════════ */
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'),
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd4b88a, 60, 340);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.05, 500);
camera.position.set(0, 1.65, 30);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

/* ═══════════════════════════════
   SKY — Lagos bright morning
   (Stables render shows bright
   midday blue sky with clouds)
═══════════════════════════════ */
const sky = new Sky();
sky.scale.setScalar(400);
scene.add(sky);
const su = sky.material.uniforms;
su.turbidity.value = 3.5;
su.rayleigh.value = 1.4;
su.mieCoefficient.value = 0.025;
su.mieDirectionalG.value = 0.88;
const sunVec = new THREE.Vector3();
sunVec.setFromSphericalCoords(1,
  THREE.MathUtils.degToRad(90-52),
  THREE.MathUtils.degToRad(195));
su.sunPosition.value.copy(sunVec);

/* ═══════════════════════════════
   LIGHTING
═══════════════════════════════ */
scene.add(new THREE.HemisphereLight(0xc8e0ff, 0x8b5020, 0.6));

const sun = new THREE.DirectionalLight(0xfff0d0, 3.0);
sun.position.set(-40, 80, 60);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 400;
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// Interior fill — warm lantern-like
const fillInside = new THREE.PointLight(0xffdd88, 1.2, 40);
fillInside.position.set(0, 3.5, 0);
scene.add(fillInside);
const hemiL = scene.children.find(o=>o.isHemisphereLight);

/* ═══════════════════════════════
   DAY / NIGHT ENGINE
═══════════════════════════════ */
const _starGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array(800*3);
  for (let i=0;i<800;i++){
    const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1)*0.5;
    pos[i*3]=185*Math.sin(p)*Math.cos(t); pos[i*3+1]=185*Math.cos(p)+10; pos[i*3+2]=185*Math.sin(p)*Math.sin(t);
  }
  _starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
}
const _starMat = new THREE.PointsMaterial({ color:0xdfe8ff, size:0.7, transparent:true, opacity:0, depthWrite:false });
scene.add(new THREE.Points(_starGeo, _starMat));

const _fogDay = new THREE.Color(0xd4b88a), _fogDusk = new THREE.Color(0xe0a068), _fogNight = new THREE.Color(0x0a1018);
let _hour = 15.5;
function setHour(h){
  _hour = h;
  const el = THREE.MathUtils.clamp(Math.sin((h-6)/12*Math.PI), -0.35, 1);
  sunVec.setFromSphericalCoords(1,
    THREE.MathUtils.degToRad(90 - el*62),
    THREE.MathUtils.degToRad(115 + ((h-6)/12)*130));
  su.sunPosition.value.copy(sunVec);
  sun.position.copy(sunVec).multiplyScalar(120);

  const day = THREE.MathUtils.smoothstep(el, 0.02, 0.28);
  const dusk = Math.max(0, 1 - Math.abs(el - .1)/.18);
  su.turbidity.value = 3.5 + dusk*7;
  su.rayleigh.value = 1.4 + dusk*1.8;
  su.mieCoefficient.value = .006 + dusk*.03;

  sun.intensity = 3.0 * day;
  sun.color.setHSL(.09 + .02*day, .5 - .25*day + dusk*.3, .55 + .12*day);
  if (hemiL) hemiL.intensity = .12 + .5*day;
  renderer.toneMappingExposure = .5 + .68*day + dusk*.15;
  _starMat.opacity = (1-day)*.9;
  scene.fog.color.copy(_fogNight).lerp(_fogDay, day).lerp(_fogDusk, dusk*.6);

  const glow = 1-day;
  fillInside.intensity = 0.8 + glow*2.6;             // stable lanterns take over at night
  scene.traverse(o=>{
    if (o.isPointLight && o !== fillInside){
      if (o.userData._i0 === undefined) o.userData._i0 = o.intensity;
      o.intensity = o.userData._i0 * (0.25 + glow*5.5);   // bollards bloom at night
    }
  });

  const hh = Math.floor(h), mm = Math.round((h-hh)*60).toString().padStart(2,'0');
  const label = day>.7? 'Lagos '+(h<12?'Morning':'Afternoon') : day>.15? 'Golden Hour' : 'Lagos Night';
  document.getElementById('todLabel').textContent = `${hh}:${mm} · ${label}`;
  document.querySelectorAll('.tod-btn').forEach(b=>b.classList.toggle('active', Math.abs(+b.dataset.h - h) < .8));
}
document.getElementById('todSlider').addEventListener('input', e=> setHour(+e.target.value));
document.querySelectorAll('.tod-btn').forEach(b=> b.addEventListener('click', ()=>{
  const target = +b.dataset.h, start = _hour, t0 = performance.now();
  document.getElementById('todSlider').value = target;
  (function anim(){ const t = Math.min(1,(performance.now()-t0)/900); setHour(start + (target-start)*(t*t*(3-2*t))); if (t<1) requestAnimationFrame(anim); })();
}));

/* ═══════════════════════════════
   CANVAS TEXTURE HELPERS
═══════════════════════════════ */
function canvasTex(w, h, fn, rep=[1,1]) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  fn(cv.getContext('2d'));
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(...rep);
  return t;
}

// Nigerian laterite brick — vivid red-orange courses
const brickTex = canvasTex(512, 512, ctx => {
  ctx.fillStyle = '#c04818';
  ctx.fillRect(0, 0, 512, 512);
  const bW=64, bH=28, mortarW=4;
  for(let row=0; row<20; row++) {
    const y = row*(bH+mortarW);
    const offset = (row%2)*(bW/2);
    for(let col=-1; col<10; col++) {
      const x = col*(bW+mortarW) + offset;
      const r = 180 + Math.floor(Math.random()*50);
      const g = 58  + Math.floor(Math.random()*28);
      const b = 12  + Math.floor(Math.random()*18);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(x+1, y+1, bW-2, bH-2);
      // Slight face variation
      ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.08})`;
      ctx.fillRect(x+2, y+2, Math.random()*30, Math.random()*10);
    }
  }
  // Mortar — grey-cream
  ctx.globalCompositeOperation = 'destination-over';
  ctx.fillStyle = '#c8b89a'; ctx.fillRect(0,0,512,512);
  ctx.globalCompositeOperation = 'source-over';
}, [6,4]);

// Terracotta tile
const tileTex = canvasTex(256, 128, ctx => {
  // Base terracotta
  ctx.fillStyle = '#c05018'; ctx.fillRect(0,0,256,128);
  // Corrugation ridges — alternating lighter/darker bands
  for(let i=0;i<16;i++){
    const x = i*16;
    ctx.fillStyle = i%2===0 ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.1)';
    ctx.fillRect(x,0,8,128);
  }
  // Weathering
  for(let i=0;i<500;i++){
    ctx.fillStyle=`rgba(0,0,0,${Math.random()*0.05})`;

// Weathered plank timber — planks, gaps, knots, grain, nails
const plankTex = canvasTex(512, 512, ctx => {
  ctx.fillStyle = '#7a5424'; ctx.fillRect(0,0,512,512);
  const PW = 64;
  for (let p=0; p<8; p++){
    const x0 = p*PW;

    ctx.fillStyle = `rgb(${base+30|0},${base*0.62|0},${base*0.28|0})`;
    ctx.fillRect(x0+2, 0, PW-4, 512);
    // grain lines per plank
    for (let i=0;i<26;i++){
      const gx = x0 + 4 + Math.random()*(PW-8);
      ctx.strokeStyle = `rgba(${40+Math.random()*50|0},${22+Math.random()*30|0},${6+Math.random()*12|0},${0.15+Math.random()*0.3})`;
      ctx.lineWidth = 0.6 + Math.random()*1.4;
      ctx.beginPath(); ctx.moveTo(gx, 0);
      ctx.bezierCurveTo(gx+Math.random()*8-4, 170, gx+Math.random()*8-4, 340, gx+Math.random()*10-5, 512);
      ctx.stroke();
    }
    // knots
    for (let k=0;k<2;k++){
      if (Math.random()<0.6){

        ctx.strokeStyle='rgba(45,25,8,0.6)'; ctx.lineWidth=1.2;
        for (let r=2;r<7;r+=1.6){ ctx.beginPath(); ctx.ellipse(kx,ky,r,r*1.5,0,0,7); ctx.stroke(); }
        ctx.fillStyle='rgba(30,16,5,0.7)'; ctx.beginPath(); ctx.ellipse(kx,ky,2,3,0,0,7); ctx.fill();
      }

    for (let i=0;i<6;i++){

    // plank gap shadow
    ctx.fillStyle='rgba(20,10,4,0.85)'; ctx.fillRect(x0, 0, 2, 512);

}, [1,1]);

function mstd(color,rough=0.85,metal=0,opts={}) {

}
const M = {
  brick:    new THREE.MeshStandardMaterial({map:brickTex,roughness:0.92,metalness:0}),
  tile:     new THREE.MeshStandardMaterial({map:tileTex,roughness:0.88,metalness:0}),

  grass:    new THREE.MeshStandardMaterial({map:grassTex,roughness:0.92,metalness:0}),

  stallDoor:new THREE.MeshStandardMaterial({map:plankTex,color:0xb08050,roughness:0.82,metalness:0}),
  steel:    mstd('#d8d0c0',0.35,0.65),
  steelDk:  mstd('#888880',0.4,0.7),
  earth:    mstd('#7a4020',0.96),
  metal:    mstd('#909090',0.35,0.75),

/* ═══════════════════════════════
   GEOMETRY HELPERS
═══════════════════════════════ */
function box(w,h,d,m){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  mesh.castShadow=true;mesh.receiveShadow=true;return mesh;
}
function cyl(rt,rb,h,m,seg=12){
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);
  mesh.castShadow=true;mesh.receiveShadow=true;return mesh;
}
function pl(w,d,m){
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);
  mesh.receiveShadow=true;mesh.rotation.x=-Math.PI/2;return mesh;
}
function add(p,c,x=0,y=0,z=0){c.position.set(x,y,z);p.add(c);return c}
function grp(){return new THREE.Group()}

/* ═══════════════════════════════
   STABLE DIMENSIONS (from plan)
   ─────────────────────────────
   Building: 62m long × 12m wide
   Stall: 4m × 4m, 12 each side
   Central aisle: 4m wide
   Tack rooms: 4m × 4m end bays
   Wall height: 3.2m to eave
   Roof peak: ~5.5m
   Eave overhang: 2.5m front
═══════════════════════════════ */
const BL = 62;   // building length
const BW = 12;   // building width
const BH = 3.2;  // wall height to eave
const ROOF_H = 5.5; // ridge height
const OVERHANG = 2.5;
const STALL_W = 4.0;
const STALL_D = 4.0;
const AISLE_W = 4.0;
const N_STALLS = 12;

const clickables = [];

/* ═══════════════════════════════
   GROUND
═══════════════════════════════ */
// Exterior earth
const gEarth = pl(300,300,M.earth);
gEarth.position.set(0,0,0);
scene.add(gEarth);

// Cobblestone yard — in front of building
const cobYard = pl(70,30,M.cobble);
cobYard.position.set(0,0.015,24);
scene.add(cobYard);

// Grass strips — flanking
const gL = pl(25,70,M.grass);gL.position.set(-44,0.01,0);scene.add(gL);
const gR = pl(25,70,M.grass);gR.position.set(44,0.01,0);scene.add(gR);
const gFront = pl(70,20,M.grass);gFront.position.set(0,0.01,46);scene.add(gFront);

/* ═══════════════════════════════
   STABLE BUILDING
   Origin: centre of building at ground
   Building runs along Z axis: from -BL/2 to +BL/2
   Width (X): -BW/2 to +BW/2
   Front (south) face is at Z = +BW/2 = +6
═══════════════════════════════ */
const stable = grp();
scene.add(stable);

/* ── FLOOR — aisle and stalls ── */
// Interior aisle floor
const aisleFlr = pl(AISLE_W, BL, M.aisleFlr);
aisleFlr.position.set(0, 0.02, 0);
stable.add(aisleFlr);

// Stall floors — straw bedding (top row: x > 0, bot row: x < 0)
for(let i=0;i<N_STALLS;i++){
  const z = -BL/2 + 2 + STALL_W*0.5 + i*STALL_W + (i>0?2:0) + 1;
  // Simplified: evenly spaced
  const zPos = -BL/2 + STALL_W/2 + i*(STALL_W + 0.12) + 3;
  // Top stalls (x = +AISLE_W/2 + STALL_D/2)
  const sf1 = pl(STALL_D, STALL_W, M.straw);
  sf1.position.set(AISLE_W/2+STALL_D/2, 0.02, zPos);
  stable.add(sf1);
  // Bottom stalls
  const sf2 = pl(STALL_D, STALL_W, M.straw);
  sf2.position.set(-(AISLE_W/2+STALL_D/2), 0.02, zPos);
  stable.add(sf2);
}

/* ── OUTER WALLS — laterite brick ── */
// Front wall (south face, facing courtyard) — Z = +BW/2
const wallFront = box(BL, BH, 0.3, M.brick);
add(stable, wallFront, 0, BH/2, BW/2);

// Back wall (north)
const wallBack = box(BL, BH, 0.3, M.brick);
add(stable, wallBack, 0, BH/2, -BW/2);

// East end wall
const wallEast = box(0.3, BH, BW, M.brick);
add(stable, wallEast, BL/2, BH/2, 0);

// West end wall
const wallWest = box(0.3, BH, BW, M.brick);
add(stable, wallWest, -BL/2, BH/2, 0);

/* ── INTERIOR DIVIDING WALLS ──
   Between north stalls and aisle,
   between south stalls and aisle
── */
// Top partition wall (between top stalls and aisle)
const partT = box(BL, BH-0.8, 0.18, M.plaster);
partT.rotation.y = 0;
add(stable, partT, 0, (BH-0.8)/2, AISLE_W/2);

// Bottom partition wall
const partB = box(BL, BH-0.8, 0.18, M.plaster);
add(stable, partB, 0, (BH-0.8)/2, -AISLE_W/2);

/* ── INTERIOR STALL PARTITION WALLS ──
   12 stalls each side, walls between them
── */
const STALL_PITCH = STALL_W + 0.12;
for(let i=0;i<=N_STALLS;i++){
  const z = -BL/2 + i*STALL_PITCH + 3;
  if(z > BL/2) break;
  // Top side partition
  const pt = box(STALL_D, BH*0.8, 0.1, M.timberDk);
  add(stable, pt, AISLE_W/2+STALL_D/2, BH*0.4, z);
  // Bottom side partition
  const pb = box(STALL_D, BH*0.8, 0.1, M.timberDk);
  add(stable, pb, -(AISLE_W/2+STALL_D/2), BH*0.4, z);
}

/* ── STALL FRONTS ──
   Horizontal timber louvre slats + X-brace + door
   (From render: open-front stalls with louvre slats
    and individual solid doors)
── */
function stallFront(xSign, zPos, idx) {
  const g = grp();
  const xBase = xSign * (AISLE_W/2);

  // Stall front surround — darker timber frame
  const frame = box(0.12, BH*0.85, STALL_W, M.plankDk);
  g.add(frame); frame.position.set(0, BH*0.425, 0);

  // Horizontal louvre slats (from render — 6 slats, spaced)
  const SLAT_H = 0.08, SLAT_GAP = 0.22;
  for(let s=0;s<8;s++){
    const y = 0.55 + s * SLAT_GAP;
    // Left half slats
    const sl = box(0.06, SLAT_H, STALL_W*0.42, M.plank);
    g.add(sl); sl.position.set(-0.02, y, -STALL_W*0.22);
    // Right half (door area)
    const sr = box(0.06, SLAT_H, STALL_W*0.42, M.plank);
    g.add(sr); sr.position.set(-0.02, y, STALL_W*0.22);
  }

  // X-brace diagonal cross — signature from render
  const diagMat = M.plankDk;
  const d1 = box(0.07, 0.07, STALL_W*0.58, diagMat);
  d1.rotation.x = Math.atan2(1.4, STALL_W*0.58);
  g.add(d1); d1.position.set(-0.02, 0.9, 0);

  const d2 = box(0.07, 0.07, STALL_W*0.58, diagMat);
  d2.rotation.x = -Math.atan2(1.4, STALL_W*0.58);
  g.add(d2); d2.position.set(-0.02, 0.9, 0);

  // Solid stall door — lower half
  const door = box(0.1, 1.0, STALL_W*0.46, M.stallDoor);
  g.add(door); door.position.set(-0.02, 0.5, STALL_W*0.22);

  // Steel column supports — from render white-painted steel posts
  const col1 = cyl(0.06, 0.06, BH, M.white, 8);
  g.add(col1); col1.position.set(0, BH/2, -STALL_W/2);
  const col2 = cyl(0.06, 0.06, BH, M.white, 8);
  g.add(col2); col2.position.set(0, BH/2, STALL_W/2);

  // Click interaction
  door.userData = { lbl:'Stall '+(idx+1), name:'Horse Stall', desc:`4m × 4m box stall · Deep straw bedding · Natural ventilation through louvre slats · Each stall named after a polo champion` };
  clickables.push(door);

  g.position.set(xBase, 0, zPos);
  g.rotation.y = xSign > 0 ? 0 : Math.PI;
  stable.add(g);
}

for(let i=0;i<N_STALLS;i++){
  const z = -BL/2 + STALL_PITCH/2 + i*STALL_PITCH + 3;
  stallFront(1,  z, i);     // north side
  stallFront(-1, z, i);     // south side
}

/* ── STEEL COLUMNS — exterior ──
   White-painted steel posts supporting overhang
   (From render: evenly spaced, circular section)
── */
const COL_SPACING = 4.0;
for(let z = -BL/2+2; z <= BL/2-2; z += COL_SPACING){
  // Front columns
  const cf = cyl(0.08, 0.08, BH+0.4, M.white, 10);
  add(stable, cf, 0, (BH+0.4)/2, BW/2+OVERHANG-0.3);
  cf.position.z = BW/2 + OVERHANG - 0.3;
  cf.position.x = z; cf.position.y = (BH+0.4)/2;
}

/* ── ROOF STRUCTURE ──
   Gabled roof with exposed timber trusses
   Terracotta corrugated tiles
   Eave overhang 2.5m front
── */
const RIDGE = ROOF_H;
const EAVE_FRONT = OVERHANG;
const EAVE_BACK = 0.6;

// Main roof slopes — two panels
// Front slope: from ridge (-BW/2 top) to eave front (+BW/2+OVERHANG)
// Using inclined planes

// Front roof slope
function roofSlope(xFrom, xTo, zLen, mat) {
  const dx = xTo - xFrom;
  const dy = RIDGE - BH; // drop from ridge to eave
  const len = Math.sqrt(dx*dx + dy*dy);
  const ang = Math.atan2(dy, Math.abs(dx));
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(zLen, len), mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.rotation.x = -Math.PI/2 + ang;
  return mesh;
}

// Front slope (south side, toward courtyard)
const roofFrontGeo = new THREE.BufferGeometry();
const rfW = BW/2 + EAVE_FRONT; // total horizontal span front
const rfH = RIDGE - BH;
// Simple inclined plane
const roofF = new THREE.Mesh(
  new THREE.PlaneGeometry(BL+1, rfW + rfH*0.6),
  M.tile
);
roofF.castShadow = true;
const rfAngle = Math.atan2(rfH, rfW);
roofF.rotation.x = -(Math.PI/2 - rfAngle);
roofF.position.set(0, BH + rfH/2 - 0.1, (BW/2+EAVE_FRONT)/2 - 0.5);
stable.add(roofF);

// Back slope (north side)
const roofBkW = BW/2 + EAVE_BACK;
const roofB = new THREE.Mesh(
  new THREE.PlaneGeometry(BL+1, roofBkW + rfH*0.6),
  M.tile
);
roofB.castShadow = true;
const rbAngle = Math.atan2(rfH, roofBkW);
roofB.rotation.x = (Math.PI/2 - rbAngle);
roofB.position.set(0, BH + rfH/2 - 0.1, -(BW/2+EAVE_BACK)/2 + 0.5);
stable.add(roofB);

// Ridge cap beam
const ridgeCap = box(BL+2, 0.18, 0.22, M.truss);
add(stable, ridgeCap, 0, RIDGE, 0);

// Gable end fills
[-BL/2, BL/2].forEach(x => {
  const gblGeo = new THREE.BufferGeometry();
  const pts = new Float32Array([
    0, BH, BW/2,   0, RIDGE, 0,   0, BH, -BW/2,
  ]);
  gblGeo.setAttribute('position', new THREE.BufferAttribute(pts,3));
  gblGeo.setIndex([0,1,2]);
  gblGeo.computeVertexNormals();
  const gbl = new THREE.Mesh(gblGeo, M.brick);
  gbl.castShadow = true;
  gbl.position.x = x;
  stable.add(gbl);
});

/* ── EXPOSED ROOF TRUSSES ──
   The signature element from the render:
   timber trusses visible inside + rafter tails
   projecting past the wall as the overhang
── */
const TRUSS_SPACING = 4.0;
for(let z=-BL/2+2; z<=BL/2-2; z+=TRUSS_SPACING){
  // Rafter tail — front overhang
  const rf = box(OVERHANG+BW/2+0.2, 0.12, 0.1, M.truss);
  rf.rotation.z = rfAngle;
  const rfLen = OVERHANG+BW/2;
  rf.position.set(rfLen/2 - 0.3, BH + (rfLen*Math.tan(rfAngle))/2 - 0.2, z);
  stable.add(rf);

  // Rafter back
  const rb = box(EAVE_BACK+BW/2+0.1, 0.1, 0.1, M.truss);
  rb.rotation.z = -rbAngle;
  rb.position.set(-(roofBkW/2 - 0.2), BH + (roofBkW*Math.tan(rbAngle))/2 - 0.2, z);
  stable.add(rb);

  // King post
  const kp = cyl(0.06,0.06,RIDGE-BH-0.1,M.truss,6);
  add(stable, kp, 0, BH + (RIDGE-BH)/2, z);

  // Tie beam (horizontal at eave)
  const tb = box(BW+0.6, 0.1, 0.1, M.truss);
  add(stable, tb, 0, BH+0.05, z);

  // Diagonal members
  [-BW/4, BW/4].forEach(x => {

// Tropical royal palms — textured curved trunks, drooping alpha fronds, wind sway
const palmCrowns = [];

const palmFrondCv = document.createElement('canvas'); palmFrondCv.width=512; palmFrondCv.height=128;
{ const g=palmFrondCv.getContext('2d');

    g.beginPath(); g.moveTo(x,cy); g.quadraticCurveTo(x+14,cy+len*.6,x+4+Math.random()*16,cy+len); g.stroke();
  }
}
const palmFrondTx = new THREE.CanvasTexture(palmFrondCv);
palmFrondTx.anisotropy = 8;
const palmTrunkM = new THREE.MeshStandardMaterial({map:palmTrunkTx,roughness:.95});
const palmFrondM = new THREE.MeshStandardMaterial({map:palmFrondTx,transparent:true,alphaTest:.4,side:THREE.DoubleSide,roughness:.9});
const palmFrondGeo = (()=>{ const geo=new THREE.PlaneGeometry(4.2,1.05,8,1); const p=geo.attributes.position;
  for(let k=0;k<p.count;k++){ const px=p.getX(k); const t=(px+2.1)/4.2; p.setY(k,p.getY(k)-t*t*1.5); }
  geo.computeVertexNormals(); return geo; })();
function palm(px,pz,s){
  s = s || 0.9+Math.random()*0.4;
  const g = grp();
  const h = (9+Math.random()*4)*s;
  const lean=(Math.random()-.5)*.26, leanZ=(Math.random()-.5)*.2;
  const pts=[];
  for(let i=0;i<=8;i++){ const t=i/8; pts.push(new THREE.Vector3(Math.sin(lean)*t*t*h*.5, t*h, Math.sin(leanZ)*t*t*h*.4)); }
  const tr = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),10,.22*s,6), palmTrunkM);
  tr.castShadow = true; g.add(tr);
  const crown = grp(); crown.position.copy(pts[8]); g.add(crown);
  for(let i=0;i<10;i++){
    const f = new THREE.Mesh(palmFrondGeo, palmFrondM);
    f.castShadow = true; f.position.x = 2.0; f.scale.setScalar(s);
    const hold = grp();
    hold.rotation.y = (i/10)*Math.PI*2 + (Math.random()-.5)*.3;
    hold.rotation.z = -0.05 - Math.random()*0.27;
    hold.add(f); crown.add(hold);
  }
  for(let i=0;i<4;i++){
    const c = new THREE.Mesh(new THREE.SphereGeometry(.14*s,7,5), palmTrunkM);
    c.position.set((Math.random()-.5)*.6, -.15, (Math.random()-.5)*.6); crown.add(c);
  }
  g.position.set(px, 0, pz);
  stable.add(g);
  palmCrowns.push({crown, phase:Math.random()*6.28});
}
[[-35,12],[-38,5],[-35,-5],[35,12],[38,5],[35,-5],[-35,-12],[35,-12]].forEach(([x,z])=>palm(x,z+BW/2));

function buildFloorplan(){
  const topG = document.getElementById('fp-top-stalls');
  const botG = document.getElementById('fp-bot-stalls');
  const stallPx = 13;
  const startX = 30;
  for(let i=0;i<12;i++){
    const x = startX + i*stallPx;
    // Top row
    const r1 = document.createElementNS('http://www.w3.org/2000/svg','rect');
    r1.setAttribute('class','fp-stall');
    r1.setAttribute('x',x); r1.setAttribute('y',2);
    r1.setAttribute('width',stallPx-1); r1.setAttribute('height',20);
    r1.setAttribute('data-stall',i);
    r1.addEventListener('click',()=>goToStall(i,1));
    topG.appendChild(r1);
    // Bottom row
    const r2 = document.createElementNS('http://www.w3.org/2000/svg','rect');
    r2.setAttribute('class','fp-stall');
    r2.setAttribute('x',x); r2.setAttribute('y',46);
    r2.setAttribute('width',stallPx-1); r2.setAttribute('height',20);
    r2.setAttribute('data-stall',i);
    r2.addEventListener('click',()=>goToStall(i,-1));
    botG.appendChild(r2);
  }
}

/* ═══════════════════════════════

const VIEWPOINTS = [
  // Exterior — standing in courtyard facing building
  { pos:[0, 2.1, BW/2+OVERHANG+30], yaw:Math.PI, pitch:0.02,
    lbl:'Exterior', name:'Horse Stables — Exterior',

  // Courtyard entrance — closer
  { pos:[0, 1.65, BW/2+OVERHANG+5], yaw:Math.PI, pitch:-0.05,

  // Main aisle — inside looking along length
  { pos:[0, 1.65, -BL/2+6], yaw:0, pitch:0,
    lbl:'Main Aisle', name:'Central Aisle',

  // Inside a stall
  { pos:[AISLE_W/2+STALL_D-0.5, 1.4, -BL/2+STALL_PITCH*1.5+3], yaw:-Math.PI/2, pitch:0,
    lbl:'Stall 2', name:'Inside Stall',

  { pos:[0, 1.65, 0], yaw:0, pitch:0.7,
    lbl:'Roof Truss', name:'Exposed Timber Trusses',

];

let curVP = 0;
let targetPos = new THREE.Vector3(...VIEWPOINTS[0].pos);
let camPos    = new THREE.Vector3(...VIEWPOINTS[0].pos);
let yaw = VIEWPOINTS[0].yaw;
let pitch = VIEWPOINTS[0].pitch;
const MAX_PITCH = Math.PI/2.5;

let isDown=false, lastX=0, lastY=0;
const cvs = document.getElementById('c');
cvs.addEventListener('mousedown', e=>{isDown=true;lastX=e.clientX;lastY=e.clientY;dismiss();});
window.addEventListener('mouseup', ()=>isDown=false);
window.addEventListener('mousemove', e=>{
  if(!isDown)return;
  yaw   -= (e.clientX-lastX)*0.003;
  pitch -= (e.clientY-lastY)*0.003;
  pitch=Math.max(-MAX_PITCH,Math.min(MAX_PITCH,pitch));
  lastX=e.clientX;lastY=e.clientY;
});
cvs.addEventListener('touchstart',e=>{isDown=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;dismiss();},{passive:true});
cvs.addEventListener('touchend',()=>isDown=false);
cvs.addEventListener('touchmove',e=>{
  if(!isDown)return;
  yaw   -=(e.touches[0].clientX-lastX)*0.004;
  pitch -=(e.touches[0].clientY-lastY)*0.004;
  pitch=Math.max(-MAX_PITCH,Math.min(MAX_PITCH,pitch));
  lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
},{passive:true});

// Gyroscope
if(window.DeviceOrientationEvent){
  let cal=null;
  window.addEventListener('deviceorientation',e=>{
    if(!cal&&e.gamma!=null)cal={b:e.beta,g:e.gamma};
    if(cal&&e.gamma!=null){
      yaw=-(e.gamma-cal.g)*0.02+Math.PI;
      pitch=-(e.beta-cal.b)*0.015;
      pitch=Math.max(-MAX_PITCH,Math.min(MAX_PITCH,pitch));
    }
  });
}

document.addEventListener('keydown',e=>{
  const n=VIEWPOINTS.length;
  if(e.key==='ArrowRight')goVP((curVP+1)%n);
  if(e.key==='ArrowLeft') goVP((curVP-1+n)%n);
  if(e.key==='Escape')    window.location.href='polo-field.html';
  dismiss();
});

// Update floor plan camera dot
function updateFPCam(){
  const cam = document.getElementById('fp-cam');
  // Map 3D Z position to SVG x, 3D X to SVG Y
  const svgX = 110 + (camPos.z / (BL/2)) * 82;
  const svgY = 34  - (camPos.x / (BW/2)) * 16;
  cam.setAttribute('cx', Math.max(10,Math.min(210,svgX)));
  cam.setAttribute('cy', Math.max(5,Math.min(63,svgY)));
}

function goVP(idx){
  curVP=idx;
  const vp=VIEWPOINTS[idx];
  targetPos.set(...vp.pos);
  yaw=vp.yaw; pitch=vp.pitch;
  document.querySelectorAll('.vpb').forEach((b,i)=>b.classList.toggle('on',i===idx));
  showInfo(vp.lbl,vp.name,vp.desc);
  dismiss();
}
window.goVP=goVP;

function goToStall(idx, side){
  const z=-BL/2+STALL_PITCH/2+idx*STALL_PITCH+3;
  const x=side*(AISLE_W/2+STALL_D-0.3);
  targetPos.set(x,1.4,z);
  yaw= side>0 ? -Math.PI/2 : Math.PI/2;
  pitch=0;
  document.querySelectorAll('.vpb').forEach(b=>b.classList.remove('on'));
  document.getElementById('vb3').classList.add('on');
  showInfo('Stall '+(idx+1),'Horse Stall',`Box stall ${idx+1} · 4m × 4m · Deep straw bedding · Naturally ventilated via louvre slats`);
  dismiss();
}

let hinted=false;
function dismiss(){
  if(hinted)return;hinted=true;
  document.getElementById('hint').classList.add('gone');
}

function showInfo(lbl,name,desc){
  document.getElementById('zl').textContent=lbl;
  document.getElementById('zn').textContent=name;
  document.getElementById('zd').textContent=desc;
  const zi=document.getElementById('zi');
  zi.classList.add('on');
  clearTimeout(zi._t);
  zi._t=setTimeout(()=>zi.classList.remove('on'),5500);
}

/* ── Raycaster ── */
const rc=new THREE.Raycaster();
const ms=new THREE.Vector2();
window.addEventListener('click',e=>{
  ms.x=(e.clientX/window.innerWidth)*2-1;
  ms.y=-(e.clientY/window.innerHeight)*2+1;
  rc.setFromCamera(ms,camera);
  const hits=rc.intersectObjects(clickables,false);
  if(hits.length){const d=hits[0].object.userData;if(d.name)showInfo(d.lbl,d.name,d.desc);}
});

/* ═══════════════════════════════
   RENDER LOOP
═══════════════════════════════ */
const lkDir=new THREE.Vector3();
const _swayClock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const _t = _swayClock.getElapsedTime();
  for (const p of palmCrowns){
    p.crown.rotation.z = Math.sin(_t*.7 + p.phase)*.03;
    p.crown.rotation.x = Math.cos(_t*.55 + p.phase)*.025;
  }
  camPos.lerp(targetPos,0.06);
  camera.position.copy(camPos);
  lkDir.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(camPos.clone().add(lkDir));
  updateFPCam();
  renderer.render(scene,camera);
}

/* ═══════════════════════════════
   INIT
═══════════════════════════════ */
function init(){
  const lp=document.getElementById('lp');
  const steps=[
    [()=>{},15],[()=>{},30],[()=>{},55],[()=>{},72],[()=>{},88],[()=>{},100]
  ];
  let i=0;
  function next(){
    if(i>=steps.length){
      lp.style.width='100%';
      setTimeout(()=>{
        document.getElementById('loader').classList.add('out');
        document.getElementById('nav').classList.add('show');
        document.getElementById('vp').classList.add('show');
        document.getElementById('floorplan').classList.add('show');
        setTimeout(()=>document.getElementById('loader').remove(),900);
        goVP(0);
        setHour(15.5);
        animate();
      },400);
      return;
    }
    lp.style.width=steps[i][1]+'%';
    i++;setTimeout(next,80);
  }
  next();
}
init();
